id: no-deprecated-iflist-empty
language: nix
severity: warning
message: "`if cond then [ x ] else [ ]` is `lib.optional cond x`; `if cond then [ a b ] else [ ]` is `lib.optionals cond [ a b ]`."
note: |
  WHY: Conditional list construction is the canonical use case for
  `lib.optional` / `lib.optionals`. The `if … then [ … ] else [ ]` shape
  reinvents it inline and is harder to grep.
  NIXPKGS: Convention across nixpkgs services and packaging.
  REPO: Use `lib.optional` for a one-element branch and `lib.optionals` for a
  multi-element list literal. The rule matches any list-literal `then` branch
  (`[ $$$ITEMS ]`); a bare list-valued variable (`if cond then xs else [ ]`)
  is left alone so it does not overlap with `prefer-or-default-over-has-attr-guard`.
rule:
  pattern: if $COND then [ $$$ITEMS ] else [ ]
