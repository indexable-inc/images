# Clone-detection config for this repo, consumed by `nix run .#clone`.
# Build outputs and third-party trees are excluded. Authored tests, fixtures,
# and snapshots stay in the scan so repeated test setup is subject to the same
# ratchet as production code.
min_lines = 8
min_nodes = 15
type3 = true
threshold = 0.95
sequences = true
window_size = 15
ignore = [
    "*/target/*",
    "*/node_modules/*",
    "*/.direnv/*",
    "*/vendored/*",
    # The tree-sitter-nix fork's generated parser tables and vendored upstream
    # grammar source (see the fork's README): parser.c is regenerated by
    # `tree-sitter generate` and pathologically self-similar the way all
    # generated state machines are, and grammar.js is upstream-authored code
    # whose repeated rule shapes are not this repo's duplication to ratchet.
    "*/tree-sitter-nix/src/parser.c",
    "*/tree-sitter-nix/grammar.js",
    # Bindgen output (regenerated by ix-vt-sys/regen-bindings.sh): mirror-image
    # C enums are the header's shape, not duplication this repo can remove.
    "*/ix-vt-sys/src/bindings.rs",
    # Vendored neovim trees under users/<name>/config/nvim. These are copies of
    # personal dotfile repos (users/harivansh-afk/neovim.nix: "the lua tree
    # deploys verbatim"), so their canonical home is upstream and a refactor
    # here would only make the next sync conflict. Duplication in them is real
    # but is upstream's to remove, not this repo's to ratchet.
    "*/users/*/config/nvim/*",
    # The upstream view trees (views/nix, views/jj, views/starship, ...):
    # verbatim mirrors of public upstream repositories, materialized by the
    # views machinery (ENG-12220) and advanced wholesale on every view sync.
    # Their duplication is upstream's to remove, not this repo's to ratchet -
    # the same reasoning is_view_path uses to exempt them from the projection's
    # boundary and secret gates, and the nvim entry above uses for dotfiles.
    # Measured 2026-08-19: views carried 99.4% of all duplicated fragment
    # lines (1,086,342 of ~1,092,600) and had dragged the whole-tree measure
    # to 4.35% against the 0.43% ratchet, because nothing ran this gate in the
    # three weeks after the GitHub archive froze the standalone repo's CI.
    # (Caveat, inherited from the glob style here: this also matches a
    # views/ directory nested deeper in the tree, which is_view_path would
    # NOT treat as a view root. No such directory exists today.)
    "*/views/*",
]

# Duplication budget consumed by `nix run .#clone` and enforced by the `clone`
# lint stage. `global_pct` is the ceiling on whole-scan `duplication_pct`
# (measured over the gated code, i.e. after the ignore globs above are applied).
#
# This is a RATCHET: the measured baseline is 0.4468%, and this ceiling sits just
# above it. Lower it as duplication is removed (re-measure with `nix run .#clone
# -- . | jq .stats.duplication_pct`). Do NOT raise it without a written reason:
# raising it silently admits new duplication.
#
# 2026-07-16 (#3433): raised 0.44 -> 0.45 by the tree-wide `cargo fmt` the new
# rust fixer lane applied. The reformat adds no duplicated logic; it expands
# one-line expressions to multi-line rustfmt shape, so fragments that fell
# under `min_lines = 8` before now cross it and count (0.4367% -> 0.4468%
# measured on the same code).
#
# 2026-07-21 (#3886): lowered 0.45 -> 0.37. Duplication had been removed since
# the last re-measure and the ceiling drifted loose; with Elixir newly gated
# (do_block/stab_clause/anonymous_function significant) the whole-tree measure
# is 0.3677%, including the two revealed pre-existing Elixir groups (parallel
# NIF-binding test scaffolding, mix.exs project boilerplate) left in the scan
# as cleanup pressure rather than ignored.
#
# 2026-07-21 (#3901): lowered 0.37 -> 0.365. The 26-line NIF-binding test
# scaffolding triplicate (plumb/tui/unibind eventually+poll) is now one staged
# helper; measured 0.3623%. The mix.exs pair stays in the scan.
#
# 2026-07-22 (#3908): lowered 0.365 -> 0.36. The eval to_dict/to_json/as_dict
# type2 triple is gone (dead method deleted, pure field dumps now
# dataclasses.asdict); measured 0.3593%. The 13-line _read_lines type1 twin
# stays in the scan as a documented pair (see both data.py docstrings).
#
# 2026-07-22 (#3996): lowered 0.36 -> 0.30. The unibind ts/py emitters no
# longer inline the async scaffold per binding: ts async exports share one
# __unibind_with_abort per glue module, the ts stream handle guts moved to
# unibind_runtime::PullStream, py __anext__ moved to
# SharedStream::next_into_py, and the gen emitter tests share their fixture
# builders and host-file walk through unibind-test-support; measured
# 0.2941%. The residual per-export class shells (napi/pyo3 need concrete
# classes) stay in the scan.
#
# 2026-07-22 (#4011): lowered 0.30 -> 0.25. The hand-copied SDK source mirror
# (packages/sdk/typescript, packages/sdk/python) is deleted; the SDK ships as
# compiled artifacts only, so the mirror's clone cluster left the scan.
# Measured 0.2497% after the deletion.
#
# 2026-07-22 (#4023): raised 0.25 -> 0.275. The #4011 drop set the budget
# 0.12% above its own 0.2497% measure, so ordinary drift (0.2502%) redded
# main the same day. Restore the ~10% headroom this file's convention calls
# for; the gate still trips on any real regression.
#
# `diff_pct` counts only duplication NEW relative to `diff_base` (#3455). A
# changed line is excused when the duplication under it already existed at the
# base: every covering fragment's per-file AST-fingerprint multiplicity was
# already there (a reflow moves lines, not fingerprints), or the line's hunk
# replaced a base region that was already inside a clone fragment (for
# reformats that legitimately alter the AST, e.g. rustfmt bracing a closure
# body). Mechanical reformats pass without exceptions; a new copy of an
# existing shape still fails.
#
# 2026-08-16 (main heal): raised 0.275 -> 0.43 after a paydown, not instead of
# one. The unibind wasm backend series in index/ pushed the whole-tree measure
# to 0.4296% and check-lint went red on main. The source is decisively
# f6a393b72925 (force-landed 2026-08-16), which landed between the 04:44Z run
# at 0.3701% and the 09:12Z run at 0.4296%. It is NOT the 12-commit train that
# landed the same morning: those commits touch crates/, docs/ and packages/ and
# no index/ file at all, so they cannot move this measure.
#
# Paid down first. gen/tests/ts.rs and gen/tests/wasm.rs each carried a full
# hand-maintained copy of the same IR fixture. It now lives once in unibind
# test-support (sample.rs) behind a parameterized `interface(name, doc)`, and
# each test keeps only its one-line target-specific wrapper: ts.rs 803 -> 526,
# wasm.rs 753 -> 475, 555 lines of real duplication deleted. Measured 0.4296%
# -> 0.3900%. Budget set to 0.43 for the ~10% headroom this file's convention
# calls for (#4023).
#
# The two snapshot SETS stay separate and untouched. They are the differential
# oracle between the ts and wasm surfaces, and sharing the fixture strengthens
# that oracle rather than collapsing it: wasm.rs claims in its own header that
# it renders "the same fixture" ts.rs does, which two hand-maintained copies
# can only intend and one shared fixture actually guarantees.
#
# Two deeper dedupes were declined on their merits, not on time. Collapsing the
# conformance suites would make that gate compare a thing to itself. Sharing
# the backend sources needs a new crate, which is unibind owner architectural
# territory, and the backends already legitimately diverge (backend-wasm
# names.rs / twin.rs, backend-ts mirror.rs). Both together measure 0.266%,
# which clears 0.275% by 3% and so would fail this file's own headroom rule
# anyway. Filed as follow-up; lower this budget when it lands.
# 2026-08-19 (mirror-CI restoration): budget UNCHANGED at 0.43. The upstream
# view trees joined the ignore list (see the entry above): they had never been
# scanned while the standalone repo's CI was alive at 0.43-passing sizes, and
# three weeks of ungated view syncs after the GitHub archive dragged the
# whole-tree measure to 4.35%. With views exempted the repo's own code
# measures 0.3894% (2,503 duplicated of 642,811 gated lines) - inside the
# ratchet it had all along.
[budget]
global_pct = 0.43
diff_pct = 0.0
diff_base = "origin/main"
