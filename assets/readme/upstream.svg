<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="a fix lands in this repo now; upstream can take it someday">
  <style>
    :root { --fg: #18181b; --muted: #8a8f98; --line: #d4d4d8; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6e6e9; --muted: #7f838c; --line: #3c3c42; }
    }
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: var(--fg); }
    .m { fill: var(--muted); }
    .cap { font-size: 12px; letter-spacing: 0.08em; }
    .frame { fill: none; stroke: var(--line); stroke-width: 1.3; }
    .wire { fill: none; stroke: var(--fg); stroke-width: 1.3; }
    .mwire { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .dash { stroke-dasharray: 3 4; }
    .head { fill: var(--fg); }
    .mhead { fill: var(--muted); }
    .ink { fill: var(--fg); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 8 4 L 0 8 z"/>
    </marker>
    <marker id="am" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="mhead" d="M 0 0 L 8 4 L 0 8 z"/>
    </marker>
  </defs>

  <rect class="frame" x="1" y="14" width="718" height="152" rx="8"/>
  <text x="60" y="95">fix</text>
  <path class="wire" marker-end="url(#a)" d="M 96 90 H 140 V 68 H 320"/>
  <text class="m cap" x="230" y="60" text-anchor="middle">now</text>
  <rect class="wire" x="330" y="40" width="330" height="56" rx="4"/>
  <text class="m cap" x="495" y="62" text-anchor="middle">this repo</text>
  <text x="495" y="84" text-anchor="middle">checked jj views</text>
  <path class="mwire dash" marker-end="url(#am)" d="M 96 96 H 140 V 132 H 320"/>
  <text class="m cap" x="230" y="124" text-anchor="middle">someday</text>
  <rect class="mwire dash" x="330" y="112" width="200" height="40" rx="4"/>
  <text class="m" x="430" y="137" text-anchor="middle">upstream</text>
</svg>
