[package]
name = "complexity-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "CLI for per-function complexity ranking and the repo complexity budget"

[[bin]]
name = "complexity"
path = "src/main.rs"

[dependencies]
ast-merge-ast.workspace = true
ast-merge-langs.workspace = true
clap = { workspace = true, features = ["derive"] }
complexity-metric.workspace = true
glob.workspace = true
rayon.workspace = true
repo-walker.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snafu.workspace = true
toml = { workspace = true, features = ["parse", "serde"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
