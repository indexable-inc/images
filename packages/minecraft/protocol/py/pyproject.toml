# No PEP 517 backend on purpose: the PyO3 cdylib is built by the shared
# cargo-unit workspace graph and packaged into a wheel by `ix.unibind.build`
# (see default.nix). `pip install .` is not a supported path.

[project]
name = "ix-mc-protocol"
version = "0.1.0"
description = "Minecraft Java Edition Server List Ping. Imported as `mc_protocol`."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "indexable" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Operating System :: POSIX",
]

[tool.pyright]
include = ["python"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
useLibraryCodeForTypes = false
reportMissingModuleSource = "none"
