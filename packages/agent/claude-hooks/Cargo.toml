[package]
name = "claude-hooks"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Claude Code/Codex hook commands (session-digest, worktree-guard, prompt-priors, subagent-cache, review pair, bash/cargo/search guards, session-banner, friction-report) as one compiled binary"

[lints]
workspace = true

[dependencies]
# The shared kernel dispatch (mcp_dispatch, used by retro-gate and
# friction-report) ships payloads as chunked base64 python_exec cells and
# encodes the delegate prompt the same way.
base64.workspace = true
# `clock` for chrono::Local (friction-report/retro-gate log timestamps).
chrono = { workspace = true, features = ["alloc", "clock"] }
# mcp_dispatch gzips payloads before upload; retro-gate's full transcripts run
# tens of MB (friction-report's condensed deltas are tiny).
flate2.workspace = true
glob.workspace = true
# mcp_dispatch speaks streamable-HTTP MCP to the ix-mcp kernel, and the
# subagent-cache hooks POST to their daemon. A blocking client keeps these
# short-lived sync hooks a plain synchronous process (no async runtime).
reqwest = { workspace = true, features = ["blocking"] }
# friction-report's single-flight flock and the detached-worker spawn
# (setsid) shared with retro-gate.
libc.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# xxh64 (seed 0) for the subagent-cache freshness hash; matches mgrep and the
# hashes other developers' hooks wrote into the shared cache.
xxhash-rust = { workspace = true, features = ["xxh64"] }

[dev-dependencies]
# temp dirs/files in the subagent-cache and mcp_dispatch tests.
tempfile.workspace = true

[[bin]]
name = "claude-hooks"
path = "src/main.rs"
