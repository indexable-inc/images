[package]
name = "unibind-ex-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "BEAM-side support for unibind's rustler backend: the shared tokio runtime, async reply plumbing, and demand-driven streams"

[lints]
workspace = true

[dependencies]
# `StreamExt::map`, for re-wrapping a stream whose items need the `Bytes`
# wire conversion before they can be encoded.
futures.workspace = true
libc.workspace = true
rustler.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
unibind-runtime.workspace = true
