[package]
name = "unibind-conformance-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Conformance cdylib for the unibind wasm backend: every construct the backend renders, exercised end to end from Node over the wasm-bindgen web target"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

# The whole crate body is `cfg(target_arch = "wasm32")` (same shape as
# ix2nix-wasm), so the shared native workspace graph compiles an empty
# cdylib with no dependency edge; only the wasm32-unknown-unknown graph
# (packages/unibind/nix/wasm.nix) pulls in the boundary and its glue deps.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
js-sys.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
unibind = { workspace = true, features = ["wasm"] }
unibind-runtime.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
