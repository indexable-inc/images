[package]
name = "unibind-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Boundary types exported code references at runtime: UniStream and the Python async helpers"

[lints]
workspace = true

[features]
py = ["dep:futures", "dep:pyo3", "dep:pyo3-async-runtimes", "dep:tokio", "tokio/sync"]

[dependencies]
# Only the `py` helpers need combinators; `UniStream` itself lives in
# unibind-stream (see its crate docs for why) and is re-exported here.
futures = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
unibind-stream.workspace = true

[dev-dependencies]
futures.workspace = true
