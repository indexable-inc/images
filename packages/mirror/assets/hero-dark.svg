<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <style>
    svg { color: #e6edf3; }
    text { fill: currentColor; }
    .muted { fill: #8b949e; }
    .box { stroke: currentColor; fill: none; stroke-width: 1.2; }
    .accent { stroke: #a371f7; fill: none; stroke-width: 1.4; }
    .edge { stroke: currentColor; fill: none; stroke-width: 1.2; marker-end: url(#arrow); }
    .head { fill: currentColor; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect class="box" x="25" y="53" width="150" height="44" rx="6"/>
  <text x="100" y="71" text-anchor="middle">monorepo</text>
  <text class="muted" x="100" y="89" text-anchor="middle" font-size="11">packages/&lt;pkg&gt;</text>

  <path class="edge" d="M175,75 L246,75"/>
  <text class="muted" x="212" y="47" text-anchor="middle" font-size="11">crate + dep closure,</text>
  <text class="muted" x="212" y="61" text-anchor="middle" font-size="11">pruned lock</text>

  <rect class="accent" x="250" y="58" width="160" height="34" rx="6"/>
  <text x="330" y="79" text-anchor="middle">mirror gen + publish</text>

  <path class="edge" d="M410,75 L516,75"/>
  <text class="muted" x="463" y="61" text-anchor="middle" font-size="11">sync on main</text>

  <rect class="box" x="520" y="58" width="180" height="34" rx="6"/>
  <text x="610" y="79" text-anchor="middle">read-only mirror repo</text>
</svg>
