[package]
name = "google-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "ix-google-mcp: a Rust MCP server exposing Gmail and Google Calendar tools over stdio, sharing one auth grant per RFC 0003"

# The rmcp tool-router macros expand into code that nightly clippy flags
# through every group; the macros do not emit `#[automatically_derived]`
# and the expansion is not under our control. Override the workspace lint
# inheritance for this thin RFC 0003 binding so the groups are allowed
# while the workspace's restriction lints stay denied.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
anonymous_tuple_return_type = "deny"
fallible_int_fallback = "deny"

[[bin]]
name = "ix-google-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["alloc", "clock", "serde"] }
google-auth.workspace = true
google-calendar.workspace = true
google-gmail.workspace = true
rmcp = { version = "1.7", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
