[package]
name = "google-calendar"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Typed Google Calendar v3 client: events list/get/create/cancel on top of the shared google-auth OAuth flow"

[lints]
workspace = true

[lib]
name = "google_calendar"
path = "src/lib.rs"

[dependencies]
# `alloc` carries the RFC 3339 formatters (`to_rfc3339`) under the
# workspace's default-features = false chrono.
chrono = { workspace = true, features = ["alloc", "serde"] }
google-auth.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snafu.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
google-auth.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
