# The `shared-audio` binary: a daemon that joins the LAN session and plays
# (runnable under launchd/systemd, e.g. via this repo's
# homeModules.portable-services), client subcommands that drive it over a
# unix control socket (status, per-user local volume, publish a new WASM
# instrument, set controls), and a macOS menu-bar volume item.
[package]
name = "audio-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "shared-audio daemon, control CLI, and macOS menu-bar volume"

[[bin]]
name = "shared-audio"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
audio-blob.workspace = true
audio-clock.workspace = true
audio-engine.workspace = true
audio-instrument.workspace = true
audio-net.workspace = true
audio-score.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
dirs.workspace = true
rodio.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
