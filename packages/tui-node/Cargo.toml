[package]
name = "tui-node"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Node.js (N-API) bindings for the tui PTY-backed terminal UI management library"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
napi.workspace = true
napi-derive.workspace = true
tui = { workspace = true, features = ["dashboard"] }

[build-dependencies]
napi-build.workspace = true

[package.metadata.cargo-machete]
# napi-build is consumed only by build.rs (`napi_build::setup()`), which
# cargo-machete does not scan, so it reports a false-positive unused dependency.
ignored = ["napi-build"]
