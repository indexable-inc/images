[package]
name = "plumb-ex"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Elixir NIF for the plumb shell via unibind: eval from the BEAM, get the run report as JSON"

[lib]
name = "plumb_ex"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
libc.workspace = true
plumb-core.workspace = true
serde.workspace = true
rustler.workspace = true
serde_json.workspace = true
unibind = { workspace = true, features = ["ex"] }
