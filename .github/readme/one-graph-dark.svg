<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="one patch fans out to every package in the graph">
  <style>
    :root { --fg: #e6e6e9; --muted: #7f838c; --line: #3c3c42; }
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: var(--fg); }
    .m { fill: var(--muted); }
    .cap { font-size: 12px; letter-spacing: 0.08em; }
    .frame { fill: none; stroke: var(--line); stroke-width: 1.3; }
    .wire { fill: none; stroke: var(--fg); stroke-width: 1.3; }
    .mwire { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .dash { stroke-dasharray: 3 4; }
    .head { fill: var(--fg); }
    .mhead { fill: var(--muted); }
    .ink { fill: var(--fg); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 8 4 L 0 8 z"/>
    </marker>
    <marker id="am" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="mhead" d="M 0 0 L 8 4 L 0 8 z"/>
    </marker>
  </defs>
  <rect class="frame" x="1" y="14" width="718" height="152" rx="8"/>
  <text x="360" y="58" text-anchor="middle">patch</text>
  <path class="mwire" d="M 360 66 L 140 120"/>
  <path class="mwire" d="M 360 66 L 195 120"/>
  <path class="mwire" d="M 360 66 L 250 120"/>
  <path class="mwire" d="M 360 66 L 305 120"/>
  <path class="mwire" d="M 360 66 L 360 120"/>
  <path class="mwire" d="M 360 66 L 415 120"/>
  <path class="mwire" d="M 360 66 L 470 120"/>
  <path class="mwire" d="M 360 66 L 525 120"/>
  <path class="mwire" d="M 360 66 L 580 120"/>
  <rect class="ink" x="135" y="124" width="10" height="10"/>
  <rect class="ink" x="190" y="124" width="10" height="10"/>
  <rect class="ink" x="245" y="124" width="10" height="10"/>
  <rect class="ink" x="300" y="124" width="10" height="10"/>
  <rect class="ink" x="355" y="124" width="10" height="10"/>
  <rect class="ink" x="410" y="124" width="10" height="10"/>
  <rect class="ink" x="465" y="124" width="10" height="10"/>
  <rect class="ink" x="520" y="124" width="10" height="10"/>
  <rect class="ink" x="575" y="124" width="10" height="10"/>
</svg>
