<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="agents write code faster than upstream review can take it; index lands the change on main now and fans it out to everyone">
  <style>
    :root { --fg: #18181b; --muted: #8a8f98; --line: #d4d4d8; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6e6e9; --muted: #7f838c; --line: #3c3c42; }
    }
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: var(--fg); }
    .m { fill: var(--muted); }
    .cap { font-size: 12px; letter-spacing: 0.08em; }
    .frame { fill: none; stroke: var(--line); stroke-width: 1.3; }
    .wire { fill: none; stroke: var(--fg); stroke-width: 1.3; }
    .mwire { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .dash { stroke-dasharray: 3 4; }
    .head { fill: var(--fg); }
    .mhead { fill: var(--muted); }
    .ink { fill: var(--fg); }
    .blk { fill: var(--fg); }
    .mblk { fill: var(--muted); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 8 4 L 0 8 z"/>
    </marker>
    <marker id="am" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="mhead" d="M 0 0 L 8 4 L 0 8 z"/>
    </marker>
  </defs>

  <rect class="frame" x="1" y="14" width="718" height="292" rx="8"/>
  <line class="frame dash" x1="24" y1="160" x2="696" y2="160"/>

  <!-- top lane: the blocked path -->
  <text x="40" y="95">agents</text>
  <path class="mwire" d="M 100 90 H 440"/>
  <path class="wire" d="M 448 58 V 122" stroke-width="2.5"/>
  <text class="m cap" x="448" y="48" text-anchor="middle">upstream review</text>
  <path class="mwire dash" marker-end="url(#am)" d="M 456 90 H 600"/>
  <text class="m cap" x="530" y="82" text-anchor="middle">someday</text>
  <text class="m" x="612" y="95">ship</text>
  <text class="m cap" x="210" y="132">waiting on review</text>

  <rect class="mblk" x="-4" y="-4" width="8" height="8">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.28;1" path="M 100 90 L 432 90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.92;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect class="mblk" x="-4" y="-4" width="8" height="8">
    <animateMotion begin="1s" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.28;1" path="M 100 90 L 418 90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.92;1" begin="1s" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect class="mblk" x="-4" y="-4" width="8" height="8">
    <animateMotion begin="2s" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.28;1" path="M 100 90 L 404 90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.92;1" begin="2s" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect class="mblk" x="-4" y="-4" width="8" height="8">
    <animateMotion begin="3s" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.28;1" path="M 100 90 L 390 90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.92;1" begin="3s" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom lane: index -->
  <text x="40" y="235">agents</text>
  <path class="wire" d="M 100 230 H 250"/>
  <text class="m cap" x="180" y="218" text-anchor="middle">now</text>
  <rect class="wire" x="258" y="210" width="70" height="40" rx="4"/>
  <text x="293" y="235" text-anchor="middle">main</text>
  <path class="wire" d="M 328 230 H 500"/>
  <path class="mwire" d="M 500 185 V 275"/>
  <path class="mwire" d="M 500 185 H 634"/>
  <path class="mwire" d="M 500 208 H 634"/>
  <path class="mwire" d="M 500 230 H 634"/>
  <path class="mwire" d="M 500 252 H 634"/>
  <path class="mwire" d="M 500 275 H 634"/>
  <text class="m cap" x="645" y="174" text-anchor="middle">everyone</text>

  <rect class="blk" x="-4" y="-4" width="8" height="8">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 100 230 L 252 230"/>
  </rect>
  <rect class="blk" x="-4" y="-4" width="8" height="8">
    <animateMotion begin="0.5s" dur="1.5s" repeatCount="indefinite" path="M 100 230 L 252 230"/>
  </rect>
  <rect class="blk" x="-4" y="-4" width="8" height="8">
    <animateMotion begin="1s" dur="1.5s" repeatCount="indefinite" path="M 100 230 L 252 230"/>
  </rect>

  <rect class="blk" x="-3.5" y="-3.5" width="7" height="7">
    <animateMotion begin="0s" dur="1.5s" repeatCount="indefinite" path="M 328 230 L 500 230 L 500 185 L 634 185"/>
  </rect>
  <rect class="blk" x="-3.5" y="-3.5" width="7" height="7">
    <animateMotion begin="0.12s" dur="1.5s" repeatCount="indefinite" path="M 328 230 L 500 230 L 500 208 L 634 208"/>
  </rect>
  <rect class="blk" x="-3.5" y="-3.5" width="7" height="7">
    <animateMotion begin="0.24s" dur="1.5s" repeatCount="indefinite" path="M 328 230 L 500 230 L 634 230"/>
  </rect>
  <rect class="blk" x="-3.5" y="-3.5" width="7" height="7">
    <animateMotion begin="0.36s" dur="1.5s" repeatCount="indefinite" path="M 328 230 L 500 230 L 500 252 L 634 252"/>
  </rect>
  <rect class="blk" x="-3.5" y="-3.5" width="7" height="7">
    <animateMotion begin="0.48s" dur="1.5s" repeatCount="indefinite" path="M 328 230 L 500 230 L 500 275 L 634 275"/>
  </rect>

  <rect class="ink" x="640" y="180" width="10" height="10">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
  </rect>
  <rect class="ink" x="640" y="203" width="10" height="10">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" begin="0.87s" repeatCount="indefinite"/>
  </rect>
  <rect class="ink" x="640" y="225" width="10" height="10">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" begin="0.99s" repeatCount="indefinite"/>
  </rect>
  <rect class="ink" x="640" y="247" width="10" height="10">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" begin="1.11s" repeatCount="indefinite"/>
  </rect>
  <rect class="ink" x="640" y="270" width="10" height="10">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" begin="1.23s" repeatCount="indefinite"/>
  </rect>
</svg>
