<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="agents write code faster than upstream review can take it; index lands the change on main now and fans it out to everyone">
  <style>
    :root { --fg: #18181b; --muted: #8a8f98; --line: #d4d4d8; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6e6e9; --muted: #7f838c; --line: #3c3c42; }
    }
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: var(--fg); }
    .m { fill: var(--muted); }
    .cap { font-size: 12px; letter-spacing: 0.08em; }
    .frame { fill: none; stroke: var(--line); stroke-width: 1.3; }
    .wire { fill: none; stroke: var(--fg); stroke-width: 1.3; }
    .mwire { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .dash { stroke-dasharray: 3 4; }
    .head { fill: var(--fg); }
    .mhead { fill: var(--muted); }
    .ink { fill: var(--fg); }
    .dot { fill: var(--fg); }
    .mdot { fill: var(--muted); }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 8 4 L 0 8 z"/>
    </marker>
    <marker id="am" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="mhead" d="M 0 0 L 8 4 L 0 8 z"/>
    </marker>
  </defs>

  <rect class="frame" x="1" y="14" width="718" height="292" rx="8"/>
  <line class="frame dash" x1="24" y1="160" x2="696" y2="160"/>

  <!-- top lane: the blocked path -->
  <text x="40" y="95">agents</text>
  <path class="mwire" d="M 100 90 H 440"/>
  <path class="wire" d="M 448 58 V 122" stroke-width="2.5"/>
  <text class="m cap" x="448" y="48" text-anchor="middle">upstream review</text>
  <path class="mwire dash" marker-end="url(#am)" d="M 456 90 H 600"/>
  <text class="m cap" x="530" y="82" text-anchor="middle">someday</text>
  <text class="m" x="612" y="95">ship</text>
  <text class="m cap" x="210" y="130">waiting on review</text>
  <rect class="mdot cursor" x="338" y="119" width="7" height="13"/>

  <circle class="mdot" r="4">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.28;1" path="M 100 90 L 432 90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.92;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle class="mdot" r="4">
    <animateMotion begin="1s" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.28;1" path="M 100 90 L 414 90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.92;1" begin="1s" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle class="mdot" r="4">
    <animateMotion begin="2s" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.28;1" path="M 100 90 L 396 90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.92;1" begin="2s" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle class="mdot" r="4">
    <animateMotion begin="3s" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.28;1" path="M 100 90 L 378 90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.92;1" begin="3s" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- bottom lane: index -->
  <text x="40" y="235">agents</text>
  <path class="wire" d="M 100 230 H 250"/>
  <text class="m cap" x="180" y="218" text-anchor="middle">now</text>
  <rect class="wire" x="258" y="210" width="70" height="40" rx="4"/>
  <text x="293" y="235" text-anchor="middle">main</text>
  <path class="wire" d="M 328 230 H 470"/>
  <path class="mwire" d="M 470 230 L 634 185"/>
  <path class="mwire" d="M 470 230 L 634 208"/>
  <path class="mwire" d="M 470 230 L 634 230"/>
  <path class="mwire" d="M 470 230 L 634 252"/>
  <path class="mwire" d="M 470 230 L 634 275"/>
  <text class="m cap" x="662" y="234" writing-mode="tb" text-anchor="middle">everyone</text>

  <circle class="dot" r="4">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 100 230 L 252 230"/>
  </circle>
  <circle class="dot" r="4">
    <animateMotion begin="0.5s" dur="1.5s" repeatCount="indefinite" path="M 100 230 L 252 230"/>
  </circle>
  <circle class="dot" r="4">
    <animateMotion begin="1s" dur="1.5s" repeatCount="indefinite" path="M 100 230 L 252 230"/>
  </circle>
  <circle class="dot" r="4">
    <animateMotion begin="0.2s" dur="1.4s" repeatCount="indefinite" path="M 328 230 L 470 230"/>
  </circle>
  <circle class="dot" r="4">
    <animateMotion begin="0.9s" dur="1.4s" repeatCount="indefinite" path="M 328 230 L 470 230"/>
  </circle>

  <circle class="dot" r="3">
    <animateMotion begin="0s" dur="1.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.33;1" path="M 470 230 L 634 185"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.36;1" dur="1.5s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle class="dot" r="3">
    <animateMotion begin="0.12s" dur="1.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.33;1" path="M 470 230 L 634 208"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.36;1" dur="1.5s" begin="0.12s" repeatCount="indefinite"/>
  </circle>
  <circle class="dot" r="3">
    <animateMotion begin="0.24s" dur="1.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.33;1" path="M 470 230 L 634 230"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.36;1" dur="1.5s" begin="0.24s" repeatCount="indefinite"/>
  </circle>
  <circle class="dot" r="3">
    <animateMotion begin="0.36s" dur="1.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.33;1" path="M 470 230 L 634 252"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.36;1" dur="1.5s" begin="0.36s" repeatCount="indefinite"/>
  </circle>
  <circle class="dot" r="3">
    <animateMotion begin="0.48s" dur="1.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.33;1" path="M 470 230 L 634 275"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.36;1" dur="1.5s" begin="0.48s" repeatCount="indefinite"/>
  </circle>

  <rect class="ink" x="640" y="180" width="10" height="10">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect class="ink" x="640" y="203" width="10" height="10">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" begin="0.62s" repeatCount="indefinite"/>
  </rect>
  <rect class="ink" x="640" y="225" width="10" height="10">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" begin="0.74s" repeatCount="indefinite"/>
  </rect>
  <rect class="ink" x="640" y="247" width="10" height="10">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" begin="0.86s" repeatCount="indefinite"/>
  </rect>
  <rect class="ink" x="640" y="270" width="10" height="10">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" begin="0.98s" repeatCount="indefinite"/>
  </rect>
</svg>
