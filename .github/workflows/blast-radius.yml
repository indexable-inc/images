name: Blast radius

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: blast-radius-${{ github.ref }}
  cancel-in-progress: true

env:
  # The self-hosted runner's Nix daemon owns substituters; the job only sets
  # client-side eval knobs (matching check.yml). `accept-flake-config` consumes
  # the flake's nixConfig (the indexable-inc Cachix substituter) without a
  # prompt, which the inner nix-eval-jobs run needs to fetch the IFD closure.
  NIX_CONFIG: |-
    experimental-features = nix-command flakes
    accept-flake-config = true

jobs:
  # Untrusted half: runs this PR's own `.#blast-radius` flake code. It holds no
  # write token and no secrets, so PR-authored code cannot reach a privileged
  # credential or poison a later token-backed step in the same job. The report
  # leaves this job only as an artifact (plain data) for the comment job.
  evaluate:
    # Same-repository, non-Dependabot PRs only (mirroring ai-review-gate.yml).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # Same self-hosted dispatcher as check.yml: the `ix-ci-run-*` label is
    # claimed by the org dispatcher, which mints an ephemeral runner with a warm
    # /nix/store. Evaluating .#checks.x86_64-linux forces an x86_64-linux IFD
    # build (lib/rust/cargo-unit.nix), so this must run on the Linux runner.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-blast-radius', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The default pull_request checkout is the merge ref, so its working tree
      # already carries this PR's `.#blast-radius` app, and fetch-depth 0 brings
      # both parents (base.sha, head.sha) into the clone so the tool's
      # `git merge-base` and the `?rev=<sha>` flake refs resolve. No write token
      # is introduced anywhere in this job.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # pipefail makes an eval failure (nonzero `nix run`) fail the step instead
      # of being masked by tee's exit code.
      - name: Report blast radius
        run: |
          set -euo pipefail
          nix run .#blast-radius -- "${BASE_SHA}" "${HEAD_SHA}" | tee report.md

      - name: Upload report
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blast-radius-${{ github.run_id }}
          path: report.md
          retention-days: 1

  # Trusted half: a fresh GitHub-hosted runner that never executes PR code. It
  # only downloads report.md and posts the sticky comment, so the write token is
  # introduced on a runner the PR cannot influence.
  comment:
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.repository_token || github.token }}
    steps:
      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blast-radius-${{ github.run_id }}
          path: .

      # One sticky comment per PR, keyed by the `<!-- blast-radius -->` marker the
      # tool prints first. Paginate the comment list so the marker is found on
      # busy PRs (no duplicate comments), then PATCH or POST.
      - name: Post sticky comment
        run: |
          set -euo pipefail
          id="$(gh api --paginate --slurp "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --jq 'map(.[] | select(.body | startswith("<!-- blast-radius -->"))) | .[0].id // empty')"
          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${REPOSITORY}/issues/comments/${id}" -F body=@report.md
          else
            gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@report.md
          fi
