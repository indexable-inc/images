name: CI deadline controller

# GitHub omits `requested` for reruns, so `in_progress` anchors those at the
# workflow attempt start. The source workflows run their GitHub-hosted budget
# job before any self-hosted build, which keeps the scarce-runner queue inside
# the deadline even on a partial rerun.
on:
  workflow_run:
    workflows: [Check, Closure gate]
    types: [requested, in_progress]

permissions:
  contents: read

concurrency:
  group: ci-deadline-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

jobs:
  deadline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel ordinary CI at its total deadline
        uses: indexable-inc/index/.github/actions/ci-budget@main
        with:
          mode: cancel
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}
          force-big-change: >-
            ${{ github.event.workflow_run.event == 'schedule'
                || github.event.workflow_run.event == 'workflow_dispatch'
                || github.event.workflow_run.event == 'push'
                && github.event.workflow_run.head_branch != 'main' }}
