name: Update content

on:
  workflow_dispatch:
  schedule:
    # One updater for every content source in the repo: the Minecraft mod /
    # loader / sound catalogs and the pinned prebuilt binaries (claude-code,
    # yc, ...). `nix run .#update` runs them all in parallel and the set is
    # discovered from the registry, so adding a package with an updateScript
    # needs no change here. claude-code promotes builds several times a week, so
    # check hourly to advance the open PR within the hour. A no-op run is a
    # cache hit and the updater reuses one branch, so this stays cheap and
    # never stacks PRs. flake.lock is updated by its own reusable workflow
    # (update-flake-lock.yml), not here.
    - cron: "37 * * * *"

permissions:
  contents: read

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # p95 44m, worst 48m over last 30 green runs (2026-07-17); 2x headroom.
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Read-only: the updater only needs warm substitutes to verify a freshly
      # pinned hash builds. Publishing happens when the resulting PR merges and
      # flake-check rebuilds on the self-hosted runners (which push to ix-ci).
      - name: Install Determinate Nix
        uses: ./.github/actions/install-nix

      # Underscore digit separators: every nix invocation that evaluates this
      # tree must go through the patched client (see the action's description).
      - name: Bootstrap patched Nix client
        uses: ./.github/actions/bootstrap-patched-nix

      # Runs every content updater in parallel via dag-runner (see
      # lib/per-system.nix). Each regenerates its own source files relative to
      # the repo root: the Minecraft catalogs/sound pack, and each pinned
      # package's sources under its own directory (manifest.json, pins.json,
      # ...).
      #
      # `|| true`: a content updater talks to an independent upstream (papermc,
      # fabric, mojang, the yc/claude-code release hosts). One flaky upstream
      # must not discard the bumps the others already wrote, so a failed node
      # does not abort the job. This is safe because each updater is itself
      # fail-closed at the point it writes: claude-code verifies Anthropic's
      # detached GPG signature before writing its manifest, and the "Build
      # changed packages" step below rejects any manifest whose pinned hash does
      # not fetch. dag-runner still prints which nodes failed.
      - name: Run updaters
        run: nix run .#update || true

      # Build every changed updater package's x86_64-linux output. This proves
      # the freshly pinned hash actually fetches and the package builds; it does
      # NOT prove provenance. An updater that verifies an upstream signature
      # (claude-code checks Anthropic's detached GPG signature over all four
      # platform checksums) is fail-closed at write time, but most pins have no
      # upstream signature and this step only builds the runner's platform, so
      # those hash changes are trusted on the strength of human PR review, not a
      # cryptographic check.
      #
      # Which attr to build comes from the registry, never from a manifest's
      # path segments: `.#updatablePackages` (lib/per-system.nix) maps each
      # `updateScript` package's directory to its flake attr for this platform.
      # A changed file with no owner in that map (the nested Minecraft catalog
      # manifests under packages/minecraft/catalogs/, or a platform-gated
      # updater like the aarch64-darwin-only dia) is skipped here and validated
      # by the PR's own flake-check CI instead (#2036).
      - name: Build changed packages
        run: |
          set -euo pipefail
          changed=$(git diff --name-only -- packages/)
          if [ -z "$changed" ]; then
            echo "no package sources changed"
            exit 0
          fi
          owners=$(nix eval --json ".#updatablePackages.x86_64-linux")
          attrs=$(jq -nr --argjson owners "$owners" --arg changed "$changed" '
            $changed | split("\n")[] as $file
            | $owners
            | to_entries[]
            | select(.key as $dir | $file | startswith($dir + "/"))
            | .value
          ' | sort -u)
          if [ -z "$attrs" ]; then
            echo "no changed file is owned by an updater package on this platform"
            exit 0
          fi
          for attr in $attrs; do
            echo "::group::nix build .#$attr"
            nix build ".#$attr"
            echo "::endgroup::"
          done

      # PRs authored by the default GITHUB_TOKEN never trigger `pull_request`
      # workflows on private repos, so the rolling bump PR gets no
      # `flake-check` and can only land when a human re-authors it (#3692;
      # the flake.lock bump #3021 sat 159 hours that way). Author the push
      # and the merge as the ix-playbook-agent GitHub App instead (contents +
      # pull-requests write, the same identity ix's updaters use) so CI runs
      # on every bump. Until the PLAYBOOK_APP_CLIENT_ID variable and
      # PLAYBOOK_APP_PRIVATE_KEY secret are configured, this is skipped and
      # the workflow keeps today's GITHUB_TOKEN behavior: the PR opens but
      # its CI stays silent.
      # Minted here, after the long update step, because installation tokens
      # expire after one hour and this job's update can run for most of that.
      - name: Mint PR token
        id: app-token
        if: ${{ vars.PLAYBOOK_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PLAYBOOK_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLAYBOOK_APP_PRIVATE_KEY }}

      # The merge half of the loop (#3692): each tick first lands the bump a
      # previous tick pushed, once CI proved it green. This runs before this
      # tick's own push below, which would reset the PR's checks back to
      # pending. The merge is an explicit API rebase (the only merge method
      # main allows), not native auto-merge, and never a bypass: a PR that
      # cannot merge on its own merits stays open. Merging with the app token
      # also means the resulting push to main triggers the post-merge
      # workflows, which a GITHUB_TOKEN merge would not.
      - name: Merge the previous green bump
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BUMP_BRANCH: update-content
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$REPOSITORY" --head "$BUMP_BRANCH" --base main \
            --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "no open rolling PR on ${BUMP_BRANCH}; nothing to merge"
            exit 0
          fi
          state="$(gh pr view "$number" --repo "$REPOSITORY" \
            --json mergeStateStatus --jq .mergeStateStatus)"
          case "$state" in
            # UNSTABLE is "required checks green, a non-required context red
            # or pending"; bot-authored PRs always carry the skipped
            # non-required `approve` context, so requiring CLEAN would never
            # merge anything.
            CLEAN | UNSTABLE)
              gh pr merge --rebase --repo "$REPOSITORY" "$number"
              echo "merged rolling PR #${number} (mergeStateStatus ${state})"
              ;;
            # BLOCKED: a required check (flake-check, closure-gate) is pending
            # or red. DIRTY: merge conflict. UNKNOWN: GitHub is still
            # computing. Each heals on a later tick after the push below
            # refreshes the branch and its checks.
            *)
              echo "rolling PR #${number} not mergeable (mergeStateStatus ${state}); leaving it for a later tick"
              ;;
          esac

      # Opens (or updates) a single PR with all refreshed content, and only when
      # something changed: create-pull-request no-ops on an empty diff. It
      # reuses the `update-content` branch so each run advances the same PR.
      #
      # `token`: the app token minted above, so the PR triggers `pull_request`
      # CI (`flake-check`) and the next scheduled tick can merge it; the
      # GITHUB_TOKEN fallback opens a PR whose CI never runs (#3692).
      # Notify the human behind a manual dispatch: review request + assignee +
      # body mention, all empty (a no-op) on the scheduled runs, which have no
      # triggering human.
      - name: Resolve triggering human
        id: trigger
        uses: ./.github/actions/triggering-actor

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          assignees: ${{ steps.trigger.outputs.user }}
          reviewers: ${{ steps.trigger.outputs.user }}
          base: main
          branch: update-content
          delete-branch: true
          commit-message: "content: refresh catalogs and pinned versions"
          title: "content: refresh catalogs and pinned versions"
          body: |
            Automated refresh of every repo content source.

            `nix run .#update` ran all content updaters in parallel: the Minecraft mod / loader / sound catalogs and every package whose `package.nix` sets `updateScript = true` (discovered from packages/registry.nix). flake.lock is handled by its own workflow.

            Each changed updater package also built on `x86_64-linux`, which proves the new hash fetches and builds but **not** that it is authentic. claude-code's updater verified Anthropic's detached GPG signature over all four platform checksums before writing. **Most pins have no upstream signature**, so please eyeball those hash changes before merging: the build only covers x86_64-linux, and the updater pins whatever bytes the release host served.

            Auto-bump, made with Claude Opus 4.8.

            ${{ steps.trigger.outputs.mention }}
