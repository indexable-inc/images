name: Fork pins

on:
  # A repin is the only way a pinned rev moves, so a PR that touches one of
  # these two files is the one moment a human can still be told the pin is not
  # on the fork's bookmark. The cron in fork-sync.yml is the backstop, hours
  # later; this is the lane that would have been red on index#4483.
  pull_request:
    branches:
      - main
    paths:
      - flake.lock
      - lib/fork-packages.nix
      - packages/upstream-sync/**
      - .github/workflows/fork-pins.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-pins-${{ github.ref }}
  cancel-in-progress: true

# Deliberately NOT a required check. It reads the forge, and this tool treats an
# unreachable forge as fatal (a pin report computed without it reads as "no
# drift", not as "unknown"), so making it required would let a GitHub outage
# block every merge. It runs in its own workflow for the same reason: a network
# read has no business inside the required flake-check.
env:
  NIX_CONFIG: |-
    experimental-features = nix-command flakes ca-derivations wasm-builtin
    accept-flake-config = false
    timeout = 600

jobs:
  fork-pins:
    # Dispatched to the org-wide ix-ci-dispatcher, the same self-hosted runner
    # scheme as check.yml: the `ix-ci-run-*` label is claimed by the dispatcher,
    # which mints an ephemeral runner per job on a host with a warm store.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-fork-pins', github.run_id, github.run_attempt) }}"]
    # Two forge reads per fork plus building the tool from a warm store.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Provision missing CLI tools
        uses: ./.github/actions/ensure-tools
        with:
          tools: gh

      - name: Compare every fork pin with its own bookmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `-e` is on by default in a workflow `run` shell (bash -e {0}), so a
          # failing pin-drift would kill this step before the table reached the
          # summary -- losing the report on exactly the runs that produce one.
          # `|| rc=$?` is inside a compound the shell tolerates.
          set -uo pipefail
          rc=0
          nix run .#upstream-sync -- pin-drift --markdown > "$RUNNER_TEMP/pins.md" || rc=$?
          {
            echo "## Fork pins"
            echo ""
            cat "$RUNNER_TEMP/pins.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
