name: Shared CI budget

on:
  workflow_call:
    inputs:
      pull-request-number:
        description: Temporary compatibility input; GitHub context owns pull request identity
        type: number
        default: 0
      extra-costly-paths:
        description: Temporary compatibility input; the shared policy owns these paths
        type: string
        default: "[]"
      force-big-change:
        description: Temporary compatibility input; the owner policy controls extension
        type: boolean
        default: false
      head-sha:
        description: Temporary compatibility input; GitHub context owns the head commit
        type: string
        default: ""
      base-sha:
        description: Temporary compatibility input; GitHub history owns the change range
        type: string
        default: ""
    outputs:
      big_change:
        description: Whether the extended CI budget applies
        value: ${{ jobs.publish.outputs.big_change }}
      reason:
        description: JSON object describing every source of the decision
        value: ${{ jobs.publish.outputs.reason }}
      standard_minutes:
        description: Standard total CI budget in whole minutes
        value: ${{ jobs.publish.outputs.standard_minutes }}
      standard_deadline:
        description: Absolute deadline measured from ordinary workflow creation
        value: ${{ jobs.publish.outputs.standard_deadline }}
      worker_timeout_minutes:
        description: Assignment-relative worker backstop for the classified tier
        value: ${{ jobs.publish.outputs.worker_timeout_minutes }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      # Pull request timeline comments require this permission even though the
      # REST resource is exposed through the issues comments endpoint.
      pull-requests: write
    outputs:
      big_change: ${{ steps.budget.outputs.big_change }}
      reason: ${{ steps.budget.outputs.reason }}
      standard_minutes: ${{ steps.budget.outputs.standard_minutes }}
      standard_deadline: ${{ steps.budget.outputs.standard_deadline }}
      worker_timeout_minutes: ${{ steps.budget.outputs.worker_timeout_minutes }}
    steps:
      # job.workflow_sha identifies the called workflow version, even when the
      # caller is another repository. https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
      - name: Checkout this policy version
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-budget-owner
          persist-credentials: false
      - name: Classify and publish CI budget
        id: budget
        uses: ./.ci-budget-owner/.github/actions/ci-budget
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          extra-costly-paths: ${{ inputs.extra-costly-paths }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          publish: true
