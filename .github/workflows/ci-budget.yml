name: Shared CI budget

on:
  workflow_call:
    inputs:
      pull-request-number:
        description: Pull request number, or 0 outside a pull request
        type: number
        default: 0
      extra-costly-paths:
        description: JSON array of repository-specific costly path globs
        type: string
        default: "[]"
      force-big-change:
        description: Grant the extended budget without a path or label match
        type: boolean
        default: false
      base-sha:
        description: Base commit for a non-pull-request change
        type: string
        default: ""
      head-sha:
        description: Head commit for a non-pull-request change
        type: string
        default: ""
    outputs:
      big_change:
        description: Whether the extended CI budget applies
        value: ${{ jobs.publish.outputs.big_change }}
      reason:
        description: JSON object describing every source of the decision
        value: ${{ jobs.publish.outputs.reason }}
      standard_minutes:
        description: Standard total CI budget in whole minutes
        value: ${{ jobs.publish.outputs.standard_minutes }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # Pull request timeline comments require this permission even though the
      # REST resource is exposed through the issues comments endpoint.
      pull-requests: write
    outputs:
      big_change: ${{ steps.budget.outputs.big_change }}
      reason: ${{ steps.budget.outputs.reason }}
      standard_minutes: ${{ steps.budget.outputs.standard_minutes }}
    steps:
      - name: Classify and publish CI budget
        id: budget
        uses: indexable-inc/index/.github/actions/ci-budget@main
        with:
          repository: ${{ github.repository }}
          pull-request-number: ${{ inputs.pull-request-number }}
          token: ${{ github.token }}
          extra-costly-paths: ${{ inputs.extra-costly-paths }}
          force-big-change: ${{ inputs.force-big-change }}
          base-sha: ${{ inputs.base-sha }}
          head-sha: ${{ inputs.head-sha }}
          publish: true
