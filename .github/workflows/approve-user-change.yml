name: Approve self-owned user changes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/approve-user-change.sh
      - .github/scripts/approve-user-change-test.sh
      - .github/user-owners.json
      - .github/workflows/approve-user-change.yml
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read

env:
  # ensure-tools resolves `nixpkgs#` attrs through the runner's nix client,
  # which needs the flake CLI enabled. Only those two features: neither job
  # evaluates this repo's flake, so the `ca-derivations` / `wasm-builtin`
  # knobs the build lanes carry would buy nothing here.
  NIX_CONFIG: |-
    experimental-features = nix-command flakes

concurrency:
  group: approve-user-change-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    # Dispatched to the org-wide ix-ci-dispatcher, the same self-hosted
    # runner scheme as check.yml: the `ix-ci-run-*` label is claimed by the
    # dispatcher, which mints an ephemeral runner per job.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-approve-user-change-test', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # shellcheck is the gate itself; the suite below reads
      # .github/user-owners.json through jq and enumerates users/ with GNU
      # find's `-printf`. None of the three are in the runner's
      # git + nix + coreutils PATH. No gh: sourcing the policy script only
      # defines its functions, so no API call runs here.
      - name: Provision missing CLI tools
        uses: ./.github/actions/ensure-tools
        with:
          tools: find=findutils jq shellcheck

      - name: Test approval policy
        run: |
          bash -n \
            .github/scripts/approve-user-change.sh \
            .github/scripts/approve-user-change-test.sh
          shellcheck -x \
            .github/scripts/approve-user-change.sh \
            .github/scripts/approve-user-change-test.sh
          .github/scripts/approve-user-change-test.sh

  approve:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    permissions:
      contents: read
      pull-requests: write
    # Dispatched to the org-wide ix-ci-dispatcher, the same self-hosted
    # runner scheme as check.yml: the `ix-ci-run-*` label is claimed by the
    # dispatcher, which mints an ephemeral runner per job. The runner is
    # ephemeral, so the write token below outlives no other job on it.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-approve-user-change', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 5
    steps:
      # pull_request_target supplies a write token, so only trusted base-branch
      # code may run. Never change this ref to the pull request head.
      - name: Checkout trusted policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # approve-user-change.sh drives the reviews API with gh and filters
      # every response through jq; the runner's PATH carries neither. Kept
      # below the checkout on purpose: `./.github/actions/...` resolves out
      # of the workspace, so this composite is the base-branch copy the
      # trust note above requires, not the pull request's.
      - name: Provision missing CLI tools
        uses: ./.github/actions/ensure-tools
        with:
          tools: gh jq

      - name: Approve current commit when the author owns every path
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/approve-user-change.sh
