name: Sync ix submodule

# ix vendors this repository at ./index. Notify it immediately whenever main
# moves; ix reads index/main itself, so the payload is diagnostic rather than
# an instruction that could make the gitlink move backward.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One dispatch at a time. The payload is diagnostic (see the header: ix reads
# index/main itself), so coalescing a burst of merges onto one notification
# loses nothing, and it keeps a busy hour from claiming a fleet runner per
# push for two API calls. cancel-in-progress stays false so the queued run
# still fires after the in-flight one.
concurrency:
  group: sync-ix-submodule
  cancel-in-progress: false

env:
  # Client-side eval knobs only; the self-hosted runner's Nix daemon owns
  # substituters and trusted keys. Same posture as check.yml / fork-sync.yml.
  # This lane evaluates no repo Nix, but the ensure-tools step below shells
  # out to a bare `nix build nixpkgs#...`, which needs the features enabled.
  NIX_CONFIG: |-
    experimental-features = nix-command flakes ca-derivations
    accept-flake-config = false

jobs:
  dispatch:
    # Dispatched to the org-wide ix-ci-dispatcher like every other lane in
    # this repo. This job was the last `ubuntu-latest` here without a written
    # reason for it (scorecard.yml is the one lane that legitimately stays
    # hosted, and says why in-file). Nothing held it back: `push` on main is
    # one of the events the dispatcher admits to the trusted-host lane
    # (ix crates/ci/dispatcher workflow_jobs.rs
    # `workflow_run_execution_environment`), the two actions below are node
    # actions the ephemeral runners already run everywhere else, and the only
    # hosted-runner dependency in the script was a bare `gh`/`jq`, provisioned
    # explicitly below.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-sync-ix-submodule', github.run_id, github.run_attempt) }}"]
    # p95 14s over the last 20 green hosted runs (2026-07-29); the 5m floor now
    # also has to cover provisioning gh and jq against a warm store, which is
    # seconds. It does NOT cover queue time: `timeout-minutes` starts when a
    # runner is assigned. A dispatch the fleet never serves therefore delays
    # rather than fails, and the recovery path is `workflow_dispatch` on ix's
    # own update-flake-lock.
    timeout-minutes: 5
    permissions:
      # Only so the runner may fetch the repo-qualified composite action
      # below; the dispatch itself rides the App token, not this one.
      contents: read
    steps:
      # The ix-ci-run-* runner PATH is bash, coreutils, dash, git, tar, gzip,
      # unzip and nix, so both externals the script below uses are absent and
      # a bare call would exit 127. Named here rather than discovered at
      # runtime. Referenced by repo, not `./.github/actions/...`, for the same
      # reason as blast-radius.yml's comment job: this job never checks the
      # repository out, so there is no local action tree to resolve a relative
      # path against.
      - name: Provision missing CLI tools
        uses: indexable-inc/index/.github/actions/ensure-tools@main
        with:
          tools: gh jq

      - name: Mint ix-scoped dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: indexable-inc
          repositories: ix
          permission-contents: write

      - name: Dispatch latest-index sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          payload="$(
            jq -nc \
              --arg repository "$SOURCE_REPOSITORY" \
              --arg sha "$SOURCE_SHA" \
              '{
                event_type: "index-main-updated",
                client_payload: {
                  source_repository: $repository,
                  source_sha: $sha
                }
              }'
          )"

          for attempt in 1 2 3; do
            if gh api --method POST \
                repos/indexable-inc/ix/dispatches \
                --input - <<<"$payload"; then
              echo "dispatched index-main-updated for ${SOURCE_SHA}"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::could not dispatch index-main-updated after three attempts"
              exit 1
            fi
            echo "::warning::dispatch attempt ${attempt} failed; retrying"
            sleep $(( attempt * 2 ))
          done
