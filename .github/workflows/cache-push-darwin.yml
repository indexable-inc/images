name: Cache push darwin

# Native aarch64-darwin twin of cache-push.yml (#1890): realise the darwin
# cachePushRoots on a GitHub-hosted mac, relay them into cache.ix.dev, and
# fast-forward `cache-ready-darwin`, the pin darwin consumers track. Its own
# workflow rather than a lane in cache-push.yml: GitHub keeps ONE pending run
# per concurrency group, so each 2h+ mac run held the shared `cache-push`
# group while every merge behind it was superseded-cancelled (24 consecutive
# runs, 08:51Z-11:08Z on 2026-07-19) and the fleet's linux pin advanced once
# per ~2h instead of once per merge (#3586). Interim: once every darwin root
# is linux-cross-built, this whole workflow is dead code (#3587). Non-gating
# for merges.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_pass:
        description: "Skip the already-cached probe: realise and push every root (heals holes left by partially-failed pushes)"
        type: boolean
        default: false

# `darwin-push` elevates to contents: write at job level for the ref move.
permissions:
  contents: read

# One mac run at a time. GitHub superseding the queued run behind a 2h+ hold
# now costs only darwin pin freshness (the probe keeps the next run
# O(changed)), never the fleet's linux pin -- that is the point of the split.
concurrency:
  group: cache-push-darwin
  cancel-in-progress: false

env:
  # For `darwin-push` on the shared self-hosted pool; `darwin-build` replaces
  # this at job level (dedicated hosted runner, see its env). Same settings
  # as cache-push.yml, including `fallback` for the poisoned-substitute
  # incident (ix#6139): remove it together with that lane's copy.
  NIX_CONFIG: |-
    experimental-features = nix-command flakes ca-derivations wasm-builtin
    accept-flake-config = false
    max-jobs = auto
    cores = 1
    fallback = true

jobs:
  # Native aarch64-darwin lane (#1890). The linux lane covers the cross-compiled
  # packages -- since #2690 that includes codex (`packages.aarch64-darwin.codex`
  # is the cross alias, so the system filter below drops it from this lane) and
  # since #3584 btop, cross-built as a CMake/C++ package with the apple-sdk
  # cross toolchain, and since #3606 nix-output-monitor, compiled by the
  # Linux-hosted cross GHC (ix.crossGhc; the #3584 infeasibility verdict
  # only condemned nixpkgs' pkgsCross SDK bootstrap, nixpkgs#405893) -- but
  # the genuinely-native darwin artifacts (the config-launch launcher units;
  # the native cargo-unit IFD graph) were never published anywhere, so every
  # darwin consumer compiled them locally. `cachePushRoots.aarch64-darwin` post-alias
  # is the honest "what a darwin consumer can install" set; filtering the eval
  # rows to `system == "aarch64-darwin"` drops the cross aliases, example-fleet
  # system closures, and linux images that resolve to x86_64-linux drvs the
  # linux `push` lane (cache-push.yml) already publishes.
  #
  # A hosted runner cannot reach the attic push shim (127.0.0.1:8070 is fleet
  # mTLS surface), so this job only realises the roots and stages the built
  # closures as a `file://` binary cache uploaded as an artifact; `darwin-push`
  # below (self-hosted, holding the push credential) relays it into ix-public.
  # attic pushes NARs regardless of their platform.
  darwin-build:
    # GitHub-hosted arm64 macs are free on public repos; the fleet has no
    # darwin runner. 3 cores / 7 GiB, so eval workers and realise parallelism
    # stay small.
    runs-on: macos-14
    # No ordering against the linux lane (in cache-push.yml since the split):
    # the darwin roots' dependency closures overlap it (shared nixpkgs paths,
    # and any x86_64-linux path a wrapper references), and those substitute
    # from cache.ix.dev only once the linux push lands. The ~27 min eval plus
    # the probe usually run out past the typical linux push, so the overlap
    # substitutes anyway; a genuinely-new x86_64-linux dep that wins the race
    # fails its root (a mac cannot build it), the publish-hole gate below
    # holds the darwin pin, and the next run substitutes it.
    #
    # A cold codex (full codex-rs workspace rustc build) is 40-80 min on this
    # runner; warm runs are probe + substitution only. Since #1916 the roots
    # also carry nix-ix (the full modular nixComponents_2_34 C++ closure):
    # even with its test suites disabled (#1967), a cold nix-ix plus a cold
    # codex plus the ~27 min eval can brush the old 240-minute budget on
    # 3 cores, and run 28772327218 showed a timeout here silently freezes
    # cache-ready. 330 leaves margin under GitHub's 360-minute job hard cap.
    timeout-minutes: 330
    outputs:
      # Realise-failure count for the cache-ready-darwin publish-hole gate (#3195).
      failed-roots: ${{ steps.realise.outputs.failed-roots }}
    env:
      # Replaces the workflow-level NIX_CONFIG: `cores = 1` there fits the
      # shared self-hosted pool, but this runner is dedicated, so each build
      # may use every core. Substituters and trusted keys go through the
      # installer step's extra-conf into /etc/nix/nix.conf instead, one
      # config the daemon also trusts. `fallback` for the same reason as the
      # linux lane (ix#6139).
      NIX_CONFIG: |-
        experimental-features = nix-command flakes ca-derivations wasm-builtin
        accept-flake-config = false
        max-jobs = auto
        fallback = true
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free scratch disk
        # arm64 hosted macs ship ~14 GB free and a cold codex realise needs
        # more than that in target-dir scratch alone: the first lane run died
        # ENOSPC at 43 MB free (run 28762717645). The preinstalled Xcode
        # bundles and simulator runtimes are dead weight here (nix brings its
        # own SDK); reclaiming them buys tens of GB. Best-effort: a layout
        # change in the runner image must not fail the lane.
        run: |
          df -h / | tail -n 1
          sudo rm -rf /Applications/Xcode_*.app ~/Library/Developer/CoreSimulator || true
          df -h / | tail -n 1

      - name: Install Determinate Nix
        uses: ./.github/actions/install-nix

      # Underscore digit separators: every nix invocation that evaluates this
      # tree must go through the patched client (see the action's description).
      - name: Bootstrap patched Nix client
        uses: ./.github/actions/bootstrap-patched-nix

      - name: Realise darwin roots and stage the relay cache
        id: realise
        shell: bash
        env:
          FULL_PASS: ${{ inputs.full_pass && '1' || '' }}
        run: |
          set -euo pipefail

          phase() { echo "::notice::darwin-build phase '$1' took $(( SECONDS - $2 ))s"; }

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          # nix-eval-jobs from the flake's locked nixpkgs (`--inputs-from .`),
          # not the repo's patched `.#nix-eval-jobs`: the patch only changes the
          # cacheStatus reporting nix-fast-build consumes (never read here), and
          # the repo package is deliberately x86_64-linux-only to avoid the
          # heavy libstore C++ rebuild -- the stock darwin binary substitutes
          # straight from cache.nixos.org. jq/xargs/grep come from the hosted
          # runner image (unlike the bare self-hosted pool PATH).
          tools_t=$SECONDS
          eval_jobs="$(nix build --inputs-from . nixpkgs#nix-eval-jobs --no-link --print-out-paths)/bin/nix-eval-jobs"
          phase tools "$tools_t"

          # The eval IFDs the native darwin cargo unit graph (vendor dir, unit
          # graph JSON, rendered cargo-units.nix); those realise here -- this is
          # a mac -- and are published as explicit roots (lib/per-system.nix
          # `nativeIfdRoots`) because consumer evals force them too. Non-darwin
          # rows are the `push` lane's responsibility and drop out. Eval errors
          # surface as warnings, not failures: an attr can legitimately refuse
          # to instantiate on darwin (linux-only module assertions), and the
          # error row does not say which system the attr would have been.
          #
          # `--gc-roots-dir` roots every instantiated drv for the realise
          # loop below: its per-root `nix store gc` otherwise deletes the
          # not-yet-realised .drv files (nothing else roots them), so once
          # the first root succeeded and gc'd, every remaining root died
          # with "failed to obtain derivation" -- 109 of 110 roots on every
          # merge (run 28883927791), which kept the cache empty and made
          # each run re-attempt the full set.
          roots="$workdir/roots.tsv"
          mkdir -p "$workdir/gcroots"
          eval_t=$SECONDS
          "$eval_jobs" \
            --flake .#cachePushRoots.aarch64-darwin \
            --workers 2 \
            --max-memory-size 2048 \
            --gc-roots-dir "$workdir/gcroots" \
            2>"$workdir/eval.err" \
            | tee "$workdir/eval.jsonl" \
            | jq -r 'select(.error == null and .system == "aarch64-darwin") | [.drvPath, (.outputs.out // "")] | @tsv' \
            | sort -u > "$roots" || true
          phase eval "$eval_t"

          jq -r 'select(.error != null) | "::warning::darwin eval failed for \(.attr): \(.error | split("\n")[0])"' \
            "$workdir/eval.jsonl" | sort -u | head -n 20

          if [ ! -s "$roots" ]; then
            echo "::error::eval produced no native darwin roots; eval log follows"
            tail -n 40 "$workdir/eval.err" >&2 || true
            exit 1
          fi

          # Skip roots already published. This probes the consumer endpoint
          # (the atticd shim is unreachable from here), which can under-report
          # -- ncps 404s paths it has not yet pulled even when atticd holds
          # them. A false miss re-realises a root, where the substituters turn
          # the "build" into a download and attic push dedups server-side:
          # wasteful, never wrong. CA roots have no eval-time out path and
          # always realise; their expensive input-addressed deps substitute.
          # FULL_PASS=1 re-realises everything to heal partial pushes.
          probe_t=$SECONDS
          : > "$workdir/cached.txt"
          if [ -z "${FULL_PASS:-}" ]; then
            # shellcheck disable=SC2016  # $1 expands in the child bash, not here
            cut -f2 "$roots" | grep -v '^$' | sort -u \
              | xargs -P 8 -n 1 bash -c \
                  'nix path-info --store https://cache.ix.dev "$1" >/dev/null 2>&1 && printf "%s\n" "$1"' _ \
              > "$workdir/cached.txt" || true
          fi
          drvs="$workdir/drvs.txt"
          while IFS=$'\t' read -r drv out; do
            if [ -z "$out" ] || ! grep -Fxq -- "$out" "$workdir/cached.txt"; then
              printf '%s\n' "$drv"
            fi
          done < "$roots" > "$drvs"
          phase probe "$probe_t"
          echo "::notice::darwin-build probe: $(wc -l < "$drvs") of $(wc -l < "$roots") roots need realising"

          # -n1 per-drv realise, same reasoning as the linux lane: a batched
          # realise prints no paths at all if any single drv fails, and the
          # wrapper records WHICH root failed so a chronic failure is loud
          # (#1863). Individual root failures keep the job green, matching
          # the linux lane: a red job here would skip `darwin-push` and lose
          # the relay of everything that DID realise. The failed-roots output
          # instead fails the run at darwin-push's cache-ready-darwin gate
          # (#3195); job-level failures (empty eval, relay upload) block
          # `cache-ready-darwin` outright.
          #
          # Each root is realised, copied into the relay cache, and then the
          # store is GC'd when scratch runs low, so closures do not
          # accumulate. The store grew monotonically before (realise all,
          # copy all at the end): on the ~14 GB hosted mac the accumulated
          # closures of ~100 roots plus a cold codex build's scratch overran
          # the disk and every remaining root died ENOSPC (run 28770353669,
          # 17 roots "failed" purely on `No space left`). The relay dir is a
          # plain NAR directory, so once a root is copied there its store
          # paths are redundant; gc reclaims everything except the pending
          # drvs (rooted by the eval's --gc-roots-dir above), and any
          # dependency a later root shares re-substitutes as a cheap
          # download.
          failed_roots="$workdir/failed-roots.txt"
          : > "$failed_roots"
          outs="$workdir/outs.txt"
          : > "$outs"
          relay_cache="file://$PWD/relay/cache?compression=zstd"
          mkdir -p relay
          realise_t=$SECONDS
          if [ -s "$drvs" ]; then
            # -P 1, not -P 3: the runner's scratch disk is the binding
            # constraint, not cores. Three concurrent rust/npm builds each
            # keep a full target dir on disk at once and the first lane run
            # died ENOSPC with 43 MB free (run 28762717645); serial roots cap
            # peak scratch at one build while `max-jobs`/`cores` still use
            # every core inside it.
            # shellcheck disable=SC2016  # positional args expand in the child
            xargs -P 1 -n 1 bash -c '
                failed="$1"; outs="$2"; relay="$3"; drv="$4"
                # Realise, then immediately copy the closure into the relay
                # and drop it from the store. A realise OR a relay-copy failure
                # records the root as failed (the copy is what darwin-push
                # relays, so a lost copy is as bad as a lost build).
                if out="$(nix-store --realise --keep-going "$drv")" \
                   && printf "%s\n" "$out" | xargs -r nix copy --to "$relay"; then
                  printf "%s\n" "$out" >> "$outs"
                  # gc only under disk pressure: an unconditional per-root gc
                  # evicts the shared deps (toolchains, stdenv closures) that
                  # every later root then re-downloads. The 20 GiB floor
                  # covers the largest single-root scratch seen so far: a
                  # cold codex build alone needs >14 GB of target dir (run
                  # 28762717645). Pending drvs survive the sweep via the
                  # eval gc roots.
                  read -r _ _ _ avail _ < <(df -Pk /nix/store | tail -n 1)
                  if [ "$avail" -lt $((20 * 1024 * 1024)) ]; then
                    nix store gc >/dev/null 2>&1 || true
                  fi
                else
                  printf "%s\n" "$drv" >> "$failed"
                  exit 1
                fi
              ' _ "$failed_roots" "$outs" "$relay_cache" \
              < "$drvs" 2>"$workdir/realise.err" \
              || {
                grep -F 'error:' "$workdir/realise.err" | sort -u | head -n 20 \
                  | while IFS= read -r line; do
                      printf '::warning::realise failed: %s\n' "${line#*error: }"
                    done
              }
          fi
          phase realise "$realise_t"

          if [ -s "$failed_roots" ]; then
            names=""
            while IFS= read -r drv; do
              name="${drv##*/}"
              name="${name#*-}"
              names="$names ${name%.drv}"
            done < "$failed_roots"
            echo "::error::darwin-build: $(wc -l < "$failed_roots") root(s) failed to realise (rebuilt and re-failed on every merge until fixed):$names"
          fi

          # Same publish-then-gate contract as the linux lane (#3195).
          echo "failed-roots=$(( $(wc -l < "$failed_roots") ))" >> "$GITHUB_OUTPUT"

          # Same silent-fallback detection as the linux lane (ix#6139).
          fallback_hits=0
          if [ -s "$workdir/realise.err" ]; then
            fallback_hits="$(grep -cE 'Transferred a partial file|unable to download|some substitutes for the outputs' "$workdir/realise.err" || true)"
          fi
          if [ "$fallback_hits" -gt 0 ]; then
            echo "::warning::darwin-build: $fallback_hits substitution-failure line(s) during realise; nix fell back to source builds (cache health degraded, see indexable-inc/ix#6139)"
          fi

          # Stage the relay: each realised root was already copied into the
          # zstd file:// cache above (per-root, to keep the store flat), so
          # here we only record the root list darwin-push feeds to attic. An
          # empty roots.txt tells darwin-push there is nothing to relay.
          sort -u "$outs" > relay/roots.txt
          if [ -s relay/roots.txt ]; then
            echo "::notice::relay cache size: $(du -sh relay | cut -f1)"
          else
            echo "::notice::every darwin root already cached; empty relay"
          fi

      - name: Upload relay artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-relay
          path: relay/
          # NARs are already zstd; zip recompression is pure CPU.
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  darwin-push:
    needs: darwin-build
    permissions:
      contents: write
    # Its own dispatch-identity label: the dispatcher spawns one runner per
    # `ix-ci-run-*` label, and the `-cache-push` SUFFIX (not the exact label)
    # plus repo + main branch is what attaches the push-only ix-public token
    # (ci-dispatcher spawn.rs ix_public_push_eligible), so this job gets the
    # same credential as cache-push.yml's `push` lane, on its own runner.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-relay-cache-push', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 60
    steps:
      # Only for `nix build .#attic-client` / `.#findutils` below.
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Underscore digit separators: every nix invocation that evaluates this
      # tree must go through the patched client (see the action's description).
      - name: Bootstrap patched Nix client
        uses: ./.github/actions/bootstrap-patched-nix

      - name: Download relay artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-relay
          path: relay/

      - name: Push relayed darwin closures to cache.ix.dev
        shell: bash
        run: |
          set -euo pipefail

          phase() { echo "::notice::darwin-push phase '$1' took $(( SECONDS - $2 ))s"; }

          if [ ! -s relay/roots.txt ]; then
            echo "::notice::darwin lane had nothing new; skipping push"
            exit 0
          fi

          # Attached to every main push; absence is a dispatcher regression.
          cred="${CREDENTIALS_DIRECTORY:-}/${IX_PUBLIC_PUSH_CREDENTIAL_NAME:-}"
          if [ ! -f "$cred" ]; then
            echo "::error::ix-public push credential not delivered (see ci-dispatcher spawn.rs ix_public_push_eligible)"
            exit 1
          fi

          set -a
          # shellcheck disable=SC1090
          . "$cred"
          set +a
          : "${ATTIC_IX_PUBLIC_PUSH_TOKEN:?credential file missing ATTIC_IX_PUBLIC_PUSH_TOKEN}"

          # Token via config file, never `attic login`: argv is world-readable
          # through /proc/<pid>/cmdline.
          workdir="$(mktemp -d)"
          # `nix copy` writes the chroot store below with store permissions
          # (read-only files and dirs), which a bare `rm -rf` cannot delete;
          # run 28787288386 pushed all 2485 paths successfully and then FAILED
          # on exactly this trap (~300k "Permission denied" lines), which
          # skipped advance-cache-ready and kept the consumer pin frozen
          # (#1968). chmod first; cleanup of the job-private tmpdir must never
          # outweigh a completed push, so it warns instead of failing.
          trap 'chmod -R u+w "$workdir" || true; rm -rf "$workdir" || echo "::warning::could not clean $workdir (job-private tmp, reaped with the runner unit)"' EXIT
          export XDG_CONFIG_HOME="$workdir/config"
          install -d -m700 "$XDG_CONFIG_HOME/attic"
          ( umask 077
            {
              printf 'default-server = "ix-public-push"\n'
              printf '[servers.ix-public-push]\n'
              printf 'endpoint = "http://127.0.0.1:8070/"\n'
              printf 'token = "%s"\n' "$ATTIC_IX_PUBLIC_PUSH_TOKEN"
            } > "$XDG_CONFIG_HOME/attic/config.toml"
          )

          tools_t=$SECONDS
          attic="$(nix build .#attic-client --no-link --print-out-paths)/bin/attic"
          xargs="$(nix build '.#findutils^out' --no-link --print-out-paths)/bin/xargs"
          phase tools "$tools_t"

          # The runner user is not a nix trusted user, so the shared daemon
          # refuses to import the relay's unsigned NARs (`--no-check-sigs` is a
          # trusted-user right). A user-owned chroot store sidesteps the daemon
          # entirely: nix and attic (whose libnixstore honours NIX_REMOTE) read
          # it like any local store, and atticd re-signs served narinfos with
          # the ix-workspace key server-side, exactly as for the linux lane.
          rstore="$workdir/store"
          import_t=$SECONDS
          nix copy --all --no-check-sigs \
            --from "file://$PWD/relay/cache" \
            --to "local?root=$rstore"
          phase import "$import_t"

          # Unlike the linux lane's fail-open push, a failure here fails the
          # job: relaying IS this job's one purpose, and darwin consumers
          # pinning `cache-ready-darwin` rely on it (#1890).
          push_t=$SECONDS
          NIX_REMOTE="local?root=$rstore" \
            "$xargs" -a relay/roots.txt -r "$attic" push --jobs 16 ix-public
          phase push "$push_t"

      # The darwin twin of advance-cache-ready: darwin consumers pin
      # `cache-ready-darwin` for the #1890 native-artifact guarantee without
      # holding the fleet's linux pin hostage to a hosted-mac build. A step
      # here (self-hosted, no extra job) rather than a hosted job: the relay
      # above is this ref's precondition, and a darwin publish hole fails
      # this job so the run stays the truth gate (#3195). The linux half of
      # the old two-lane gate reads the `cache-ready` ref instead (see the
      # step): this workflow has no `push` job output to consult.
      - name: Fast-forward cache-ready-darwin
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DARWIN_FAILED_ROOTS: ${{ needs.darwin-build.outputs.failed-roots }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(( ${DARWIN_FAILED_ROOTS:-0} ))" -gt 0 ]; then
            echo "::error::not advancing cache-ready-darwin over a publish hole: ${DARWIN_FAILED_ROOTS:-0} darwin root(s) failed to realise (#3195)"
            exit 1
          fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::not on main ($GITHUB_REF); leaving cache-ready-darwin alone"
            exit 0
          fi

          # The linux half of the publish-hole gate, read from the ref rather
          # than a job output: advance-cache-ready (cache-push.yml) moves
          # `cache-ready` only over a hole-free linux run (#3195), so the ref
          # containing $SHA proves this rev's x86_64-linux closure is fully
          # published. Behind means lag, not failure -- the linux lane is
          # still working (or holding over its own hole); exit clean and let
          # a later darwin run advance past this rev once it catches up.
          status="$(gh api "repos/$REPOSITORY/compare/$SHA...cache-ready" --jq .status || echo unknown)"
          if [ "$status" != "identical" ] && [ "$status" != "ahead" ]; then
            echo "::notice::cache-ready does not contain $SHA (compare status: $status); linux closure not fully published yet, leaving cache-ready-darwin alone"
            exit 0
          fi

          if ! current="$(gh api "repos/$REPOSITORY/git/ref/heads/cache-ready-darwin" --jq .object.sha)"; then
            gh api -X POST "repos/$REPOSITORY/git/refs" \
              -f ref=refs/heads/cache-ready-darwin -f "sha=$SHA" > /dev/null
            echo "::notice::created cache-ready-darwin at $SHA"
            exit 0
          fi

          if [ "$current" = "$SHA" ]; then
            echo "::notice::cache-ready-darwin already at $SHA"
            exit 0
          fi

          # force=false: fast-forward-only, same rationale as cache-ready.
          if gh api -X PATCH "repos/$REPOSITORY/git/refs/heads/cache-ready-darwin" \
               -f "sha=$SHA" -F force=false > /dev/null; then
            echo "::notice::cache-ready-darwin advanced: $current -> $SHA"
          else
            echo "::notice::cache-ready-darwin not moved (non-fast-forward; a newer run owns the ref)"
          fi

