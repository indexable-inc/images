name: Kani eval

on:
  push:
    branches:
      - codex/kani-eval
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kani:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Kani proof harness
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.67.0"
          command: cargo-kani
          args: "-p nix-cargo-unit --harness short_digest_encodes_every_byte_as_lowercase_hex"
