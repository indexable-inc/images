name: Check

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
    # A manual budget override must start a fresh run. A job's timeout is fixed
    # when it starts, so changing the label cannot extend an in-flight job.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Required status for the merge queue: GitHub fires `merge_group` against a
  # temporary `gh-readonly-queue/main/...` ref, and the `main` ruleset demands a
  # `flake-check` status on it. Without this trigger the check never runs in the
  # queue, so every enqueued PR stalls in AWAITING_CHECKS until it times out.
  merge_group:

permissions:
  contents: read

concurrency:
  # PR refs supersede: a newer synchronization makes the older revision's
  # result unusable, so group per-ref and cancel it. Main is the opposite:
  # required checks are non-strict, so two individually-green PRs can rebase
  # into a red union that no PR run ever validated (#3669: every main Check
  # from 10:56Z-11:08Z on 2026-07-19 was cancelled by the next push, so an
  # 8.5h site breakage surfaced as a frozen cache-ready pin instead of a
  # named commit). Main groups per-commit and never cancels, so every merged
  # commit carries its own completed verdict. Tag refs remain independent.
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && (github.event_name == 'pull_request' || github.event_name == 'push') }}

env:
  # The self-hosted runner's Nix daemon owns substituters (cache.ix.dev plus the
  # host's local cache), so the job only sets client-side eval knobs here rather
  # than installing Nix or managing a GitHub Actions store cache.
  #
  # `accept-flake-config = false`: the shared daemon already owns substituters,
  # trusted keys, and experimental protocol features. The ephemeral runner UID
  # is deliberately untrusted, so accepting the flake's restricted cache
  # settings only produces ignored-setting warnings on every evaluator worker.
  #
  # We do NOT set `extra-system-features = gccarch-znver5` here: every image
  # pins `nixpkgs.hostPlatform.gcc.arch = "znver5"`, so each derivation needs
  # the `gccarch-znver5` system feature -- but the runner host advertises it
  # daemon-side (ix hardware/znver5.nix), which is the layer Nix actually
  # consults. As a restricted setting from the untrusted CI runner user it was
  # ignored regardless, emitting only a "not a trusted user" warning.
  #
  # `max-jobs = auto` builds one derivation per core; `cores = 1` keeps each
  # build single-threaded. The closure is wide, so parallelism comes from
  # building many derivations at once, not threads inside one build.
  # https://nix.dev/manual/nix/2.28/advanced-topics/cores-vs-jobs
  # `ca-derivations`: the rust workspace units default to
  # `contentAddressed = true` (lib/rust/cargo-unit.nix), so evaluating the
  # check / package sets resolves floating content-addressed derivations.
  # Without the feature the evaluator aborts with "experimental Nix feature
  # 'ca-derivations' is disabled". Keep the client feature here because CI
  # intentionally does not consume repository flake configuration.
  NIX_CONFIG: |-
    experimental-features = nix-command flakes ca-derivations
    accept-flake-config = false
    max-jobs = auto
    cores = 1

jobs:
  ci-budget:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: indexable-inc/index/.github/workflows/ci-budget.yml@main
    with:
      pull-request-number: ${{ github.event.pull_request.number || 0 }}
      # Labels exist only on pull requests. Preserve the existing limit for
      # main, tag, and merge-queue validation rather than silently shrinking
      # those non-PR operational gates.
      force-big-change: ${{ github.event_name != 'pull_request' }}

  # One job on one runner, on purpose. Every check shares a single
  # znver5-tuned nixpkgs base, so fanning the checks across several runners
  # would rebuild that shared base on each cold runner (a thundering herd). We
  # keep one runner and get parallelism *inside* it from nix-fast-build plus
  # `max-jobs = auto`. Branch protection requires a status named `flake-check`;
  # this job is it, and it fails iff a check fails to build or the flake stops
  # evaluating.
  flake-check:
    needs: ci-budget
    # Dispatched to the org-wide ix-ci-dispatcher (vin-compute-1), the same
    # self-hosted runner the ix repo uses. The `ix-ci-run-*` label is claimed
    # by that dispatcher, which mints an ephemeral runner per job on a host
    # with a warm, persistent /nix/store. See the ix repo's ci.yml for the
    # label scheme.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-flake-check', github.run_id, github.run_attempt) }}"]
    # Assignment-relative backstop. The worker action below owns independent
    # queue, setup, validation, and cleanup clocks; this job timeout is only a
    # final runner-level guard.
    timeout-minutes: ${{ fromJSON(needs.ci-budget.outputs.worker_timeout_minutes) }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Enforce runner queue admission
        uses: indexable-inc/index/.github/actions/ci-budget/worker@main
        with:
          mode: check
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          big-change: ${{ needs.ci-budget.outputs.big_change }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The clone diff gate reads both parents of the checked-out merge.
          fetch-depth: 0

      # Underscore digit separators: every nix invocation that evaluates this
      # tree must go through the patched client (see the action's description).
      - name: Bootstrap patched Nix client
        uses: ./.github/actions/bootstrap-patched-nix

      # Build the gate's network tracer (#4031) from main's flake ref, outside
      # the validation clock below so tracing never eats PR budget. From main,
      # not this PR's tree: a PR-tree build would eval the PR's flake untraced
      # and warm exactly the fetches the tracer exists to catch. Fail open: a
      # missing attr (first run after landing) or any build error just leaves
      # NET_TRACE unset and the gate runs untraced.
      - name: Bootstrap net-trace
        continue-on-error: true
        run: |
          set -uo pipefail
          if out="$(nix build 'github:${{ github.repository }}/main#net-trace' --no-link --print-out-paths 2>/dev/null)"; then
            echo "NET_TRACE=${out}/bin/net-trace" >> "$GITHUB_ENV"
          fi

      # One budgeted process group owns both the changed-line clone gate and the
      # required-root Nix gate. The worker action starts a fresh validation clock
      # after setup, terminates the whole descendant group on timeout or cancel,
      # and leaves queue time out of the build budget.
      - name: Run required gate within its validation clock
        uses: indexable-inc/index/.github/actions/ci-budget/worker@main
        with:
          mode: run
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          big-change: ${{ needs.ci-budget.outputs.big_change }}
          script: .github/scripts/run-required-gate.sh
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      # The `check` app writes nix-fast-build per-attr durations to
      # check-results.json in the workspace (see lib/per-system.nix). Upload it
      # so the blast-radius workflow can fetch the most recent successful base
      # run and annotate the rebuilt-checks list with wall-clock seconds. The
      # artifact is data-only, and the upload runs even on a failing build so a
      # partial-timings snapshot still beats no timings at all.
      - name: Upload check-results.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-timings-${{ github.run_id }}
          path: check-results.json
          if-no-files-found: warn
          retention-days: 30

      # Client-side network profile of the gate (#4031), written by
      # run-required-gate.sh's EXIT trap. Data-only; the trusted comment job
      # below validates and renders it. Uploaded even on failure because a red
      # run's network profile is the most interesting one. `ignore`: the file
      # is absent whenever the gate ran untraced (tracer bootstrap fails open).
      - name: Upload net-trace summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: net-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: net-trace-summary.json
          if-no-files-found: ignore
          retention-days: 7

  # Keep the existing required context while consuming no second self-hosted
  # runner. The single gate above builds closure roots and checks together;
  # this hosted terminal job fails closed for every non-success conclusion,
  # including cancellation and a missing upstream result.
  # Sticky PR comment with the required gate's client-side network profile
  # (#4031). Trust split mirrors blast-radius.yml: net-trace-summary.json is
  # produced by PR-controlled code inside the gate, so the write-token job
  # never executes PR code; it validates the shape fail-closed and renders the
  # Markdown itself. Hosted terminal job by the closure-gate precedent above:
  # it consumes no self-hosted runner and runs no build.
  net-trace-comment:
    needs: flake-check
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # continue-on-error: the artifact is missing whenever the gate ran
      # untraced (tracer bootstrap fails open) or died before its EXIT trap;
      # a missing profile must not mark the run red.
      - name: Download summary
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: net-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      # Fail closed on shape: every number is type-checked, labels and hosts
      # pass a conservative charset, schemes are enumerated, and array lengths
      # are capped, so a hostile summary cannot inject Markdown, mentions, or
      # a megabyte comment through the write token.
      - name: Validate summary schema
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          jq -e -s '
            def label_ok: type == "string" and test("\\A[a-z][a-z0-9-]{0,63}\\z");
            def host_ok: type == "string" and test("\\A[A-Za-z0-9._:-]{1,253}\\z");
            def num: type == "number" and . >= 0;
            length == 1 and
            (.[0].phases | type == "array" and length <= 16 and all(
              (.label | label_ok) and
              (.wallMs | num) and (.networkWallMs | num) and
              (.connections | num) and (.failed | num) and
              (.bytesUp | num) and (.bytesDown | num) and
              (.topHosts | type == "array" and length <= 16 and all(
                (.host | host_ok) and (.port | num and . <= 65535) and (.connections | num) and
                (.connectedMs | num) and (.bytesUp | num) and (.bytesDown | num) and
                (.failed | num))) and
              (.longest | type == "array" and length <= 16 and all(
                (.host | host_ok) and (.port | num and . <= 65535) and (.startMs | num) and
                (.durMs | num) and (.bytesUp | num) and (.bytesDown | num) and
                (.scheme == "connect" or .scheme == "http") and
                ((.failed | type) == "boolean")))
            ))
          ' net-trace-summary.json > /dev/null \
            || { echo "::error::malformed net-trace-summary.json"; exit 1; }

      # Rebuild the Markdown from validated data only; the marker matches the
      # Rust renderer's so local `net-trace render` and this comment key the
      # same sticky slot.
      - name: Render comment
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          jq -r '
            def fmt_ms: if . < 1000 then "\(round)ms" elif . < 60000 then "\(. / 100 | round / 10)s" else "\(. / 6000 | round / 10)m" end;
            def fmt_bytes: if . < 1024 then "\(round)B" elif . < 1048576 then "\(. / 102.4 | round / 10)KiB" else "\(. / 104857.6 | round / 10)MiB" end;
            def bar(n): if n <= 0 then "#" else reduce range(0; n) as $i (""; . + "#") end;
            "<!-- net-trace -->",
            "### Client-side network during CI",
            "",
            "| phase | wall | network wall | conns | failed | down | up |",
            "| --- | --- | --- | --- | --- | --- | --- |",
            (.phases[] | "| \(.label) | \(.wallMs | fmt_ms) | \(.networkWallMs | fmt_ms) | \(.connections) | \(.failed) | \(.bytesDown | fmt_bytes) | \(.bytesUp | fmt_bytes) |"),
            (.phases[] | select((.topHosts | length) > 0) |
              "", "**\(.label): top hosts**", "",
              "| host | conns | time | down | up |",
              "| --- | --- | --- | --- | --- |",
              (.topHosts[] | "| \(.host):\(.port) | \(.connections) | \(.connectedMs | fmt_ms) | \(.bytesDown | fmt_bytes) | \(.bytesUp | fmt_bytes) |")),
            (([.phases[] | . as $phase | .longest[] | {phase: $phase.label, conn: .}]
              | sort_by(-.conn.durMs) | .[0:8]) as $rows
             | if ($rows | length) == 0 then empty
               else (if $rows[0].conn.durMs < 1 then 1 else $rows[0].conn.durMs end) as $max
               | "", "```text",
                 ($rows[] | "\(.conn.host):\(.conn.port) +\(.conn.startMs | fmt_ms) \(bar(.conn.durMs * 24 / $max | floor)) \(.conn.durMs | fmt_ms) [\(.phase)]\(if .conn.failed then " FAILED" else "" end)"),
                 "```"
               end),
            "",
            "<sub>Client-side connections only (proxy env): eval fetches, gh, git. Daemon-side substitutions and fixed-output builders are not visible here. Run: \(env.RUN_URL // "local")</sub>"
          ' net-trace-summary.json > comment.md
        env:
          # Trusted provenance for the sticky comment: tracing fails open, so
          # without this a stale comment could silently describe an older push.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # One sticky comment per PR, keyed by the `<!-- net-trace -->` marker;
      # pagination and the bot-author restriction mirror blast-radius.yml.
      - name: Post sticky comment
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          id="$(gh api --paginate --slurp "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  | jq -r 'map(.[] | select((.user.login == "github-actions[bot]" or .user.login == "github-actions") and ((.body // "") | startswith("<!-- net-trace -->")))) | .[0].id // empty')"
          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${REPOSITORY}/issues/comments/${id}" -F body=@comment.md
          else
            gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md
          fi

  closure-gate:
    needs: flake-check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Mirror the required-root gate
        env:
          FLAKE_CHECK_RESULT: ${{ needs.flake-check.result }}
        run: |
          if [[ "${FLAKE_CHECK_RESULT}" != "success" ]]; then
            printf 'flake-check result was %s; refusing a false-green closure gate\n' "${FLAKE_CHECK_RESULT}" >&2
            exit 1
          fi
