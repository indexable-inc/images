name: Check

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
    # A manual budget override must start a fresh run. A job's timeout is fixed
    # when it starts, so changing the label cannot extend an in-flight job.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Required status for the merge queue: GitHub fires `merge_group` against a
  # temporary `gh-readonly-queue/main/...` ref, and the `main` ruleset demands a
  # `flake-check` status on it. Without this trigger the check never runs in the
  # queue, so every enqueued PR stalls in AWAITING_CHECKS until it times out.
  merge_group:

permissions:
  contents: read

concurrency:
  # PR refs supersede: a newer synchronization makes the older revision's
  # result unusable, so group per-ref and cancel it. Main is the opposite:
  # required checks are non-strict, so two individually-green PRs can rebase
  # into a red union that no PR run ever validated (#3669: every main Check
  # from 10:56Z-11:08Z on 2026-07-19 was cancelled by the next push, so an
  # 8.5h site breakage surfaced as a frozen cache-ready pin instead of a
  # named commit). Main groups per-commit and never cancels, so every merged
  # commit carries its own completed verdict. Tag refs remain independent.
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && (github.event_name == 'pull_request' || github.event_name == 'push') }}

env:
  # The self-hosted runner's Nix daemon owns substituters (cache.ix.dev plus the
  # host's local cache), so the job only sets client-side eval knobs here rather
  # than installing Nix or managing a GitHub Actions store cache.
  #
  # `accept-flake-config = false`: the shared daemon already owns substituters,
  # trusted keys, and experimental protocol features. The ephemeral runner UID
  # is deliberately untrusted, so accepting the flake's restricted cache
  # settings only produces ignored-setting warnings on every evaluator worker.
  #
  # We do NOT set `extra-system-features = gccarch-znver5` here: every image
  # pins `nixpkgs.hostPlatform.gcc.arch = "znver5"`, so each derivation needs
  # the `gccarch-znver5` system feature -- but the runner host advertises it
  # daemon-side (ix hardware/znver5.nix), which is the layer Nix actually
  # consults. As a restricted setting from the untrusted CI runner user it was
  # ignored regardless, emitting only a "not a trusted user" warning.
  #
  # `max-jobs = auto` builds one derivation per core; `cores = 1` keeps each
  # build single-threaded. The closure is wide, so parallelism comes from
  # building many derivations at once, not threads inside one build.
  # https://nix.dev/manual/nix/2.28/advanced-topics/cores-vs-jobs
  # `ca-derivations`: the rust workspace units default to
  # `contentAddressed = true` (lib/rust/cargo-unit.nix), so evaluating the
  # check / package sets resolves floating content-addressed derivations.
  # Without the feature the evaluator aborts with "experimental Nix feature
  # 'ca-derivations' is disabled". Keep the client feature here because CI
  # intentionally does not consume repository flake configuration.
  NIX_CONFIG: |-
    experimental-features = nix-command flakes ca-derivations
    accept-flake-config = false
    max-jobs = auto
    cores = 1

jobs:
  ci-budget:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: indexable-inc/index/.github/workflows/ci-budget.yml@main
    with:
      pull-request-number: ${{ github.event.pull_request.number || 0 }}
      # Labels exist only on pull requests. Preserve the existing limit for
      # main, tag, and merge-queue validation rather than silently shrinking
      # those non-PR operational gates.
      force-big-change: ${{ github.event_name != 'pull_request' }}

  # One job on one runner, on purpose. Every check shares a single
  # znver5-tuned nixpkgs base, so fanning the checks across several runners
  # would rebuild that shared base on each cold runner (a thundering herd). We
  # keep one runner and get parallelism *inside* it from nix-fast-build plus
  # `max-jobs = auto`. Branch protection requires a status named `flake-check`;
  # this job is it, and it fails iff a check fails to build or the flake stops
  # evaluating.
  flake-check:
    needs: ci-budget
    # Dispatched to the org-wide ix-ci-dispatcher (vin-compute-1), the same
    # self-hosted runner the ix repo uses. The `ix-ci-run-*` label is claimed
    # by that dispatcher, which mints an ephemeral runner per job on a host
    # with a warm, persistent /nix/store. See the ix repo's ci.yml for the
    # label scheme.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-flake-check', github.run_id, github.run_attempt) }}"]
    # Assignment-relative backstop. The worker action below owns independent
    # queue, setup, validation, and cleanup clocks; this job timeout is only a
    # final runner-level guard.
    timeout-minutes: ${{ fromJSON(needs.ci-budget.outputs.worker_timeout_minutes) }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Enforce runner queue admission
        uses: indexable-inc/index/.github/actions/ci-budget/worker@main
        with:
          mode: check
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          big-change: ${{ needs.ci-budget.outputs.big_change }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The clone diff gate reads both parents of the checked-out merge.
          fetch-depth: 0

      # Underscore digit separators: every nix invocation that evaluates this
      # tree must go through the patched client (see the action's description).
      - name: Bootstrap patched Nix client
        uses: ./.github/actions/bootstrap-patched-nix

      # One budgeted process group owns both the changed-line clone gate and the
      # required-root Nix gate. The worker action starts a fresh validation clock
      # after setup, terminates the whole descendant group on timeout or cancel,
      # and leaves queue time out of the build budget.
      - name: Run required gate within its validation clock
        uses: indexable-inc/index/.github/actions/ci-budget/worker@main
        with:
          mode: run
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          big-change: ${{ needs.ci-budget.outputs.big_change }}
          script: .github/scripts/run-required-gate.sh
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      # The `check` app writes nix-fast-build per-attr durations to
      # check-results.json in the workspace (see lib/per-system.nix). Upload it
      # so the blast-radius workflow can fetch the most recent successful base
      # run and annotate the rebuilt-checks list with wall-clock seconds. The
      # artifact is data-only, and the upload runs even on a failing build so a
      # partial-timings snapshot still beats no timings at all.
      - name: Upload check-results.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-timings-${{ github.run_id }}
          path: check-results.json
          if-no-files-found: warn
          retention-days: 30

      # Autofix push (#3435): the lint check above judged the composed FIXED
      # tree (lib/per-system.nix `lintFix`), so a green gate plus a non-empty
      # `.#lint-fix-patch` means the PR head carries drift the fixer lanes
      # repair; push that diff back to the PR branch as one `style: autofix`
      # commit instead of failing. The new head SHA goes through the normal
      # required checks -- green by construction, since the gate already
      # passed on the fixed tree. Pushed with a token minted from the
      # ix-mirror-sync GitHub App (the repo's only push-capable CI
      # credential; AUTOBUMP_TOKEN was never configured), narrowed to
      # contents:write: a default-GITHUB_TOKEN push never retriggers
      # workflows, which would leave the fix commit checkless. These steps
      # run after the artifact upload on purpose: the push retriggers this
      # workflow on the new head, whose concurrency group cancels the rest
      # of this run.
      - name: Mint autofix push token
        id: autofix-token
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.MIRROR_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push lint autofix commit
        if: github.event_name == 'pull_request'
        env:
          AUTOFIX_PUSH_TOKEN: ${{ steps.autofix-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The app's bot identity, so the commit is attributed to the app
          # that pushed it. 300601727 is ix-mirror-sync[bot]'s stable user id
          # (https://api.github.com/users/ix-mirror-sync%5Bbot%5D).
          GIT_AUTHOR_NAME: ix-mirror-sync[bot]
          GIT_AUTHOR_EMAIL: 300601727+ix-mirror-sync[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ix-mirror-sync[bot]
          GIT_COMMITTER_EMAIL: 300601727+ix-mirror-sync[bot]@users.noreply.github.com
        run: bash .github/scripts/push-lint-autofix.sh

  # Keep the existing required context while consuming no second self-hosted
  # runner. The single gate above builds closure roots and checks together;
  # this hosted terminal job fails closed for every non-success conclusion,
  # including cancellation and a missing upstream result.
  closure-gate:
    needs: flake-check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Mirror the required-root gate
        env:
          FLAKE_CHECK_RESULT: ${{ needs.flake-check.result }}
        run: |
          if [[ "${FLAKE_CHECK_RESULT}" != "success" ]]; then
            printf 'flake-check result was %s; refusing a false-green closure gate\n' "${FLAKE_CHECK_RESULT}" >&2
            exit 1
          fi
