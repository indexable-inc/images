name: Check

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
    # A budget label change starts a fresh attempt so classification and its
    # total deadline agree for the lifetime of the attempt.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Required status for the merge queue: GitHub fires `merge_group` against a
  # temporary `gh-readonly-queue/main/...` ref, and the `main` ruleset demands a
  # `flake-check` status on it. Without this trigger the check never runs in the
  # queue, so every enqueued PR stalls in AWAITING_CHECKS until it times out.
  merge_group:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The self-hosted runner's Nix daemon owns substituters (cache.ix.dev plus the
  # host's local cache), so the job only sets client-side eval knobs here rather
  # than installing Nix or managing a GitHub Actions store cache.
  #
  # `accept-flake-config = false`: the shared daemon already owns substituters,
  # trusted keys, and experimental protocol features. The ephemeral runner UID
  # is deliberately untrusted, so accepting the flake's restricted cache
  # settings only produces ignored-setting warnings on every evaluator worker.
  #
  # We do NOT set `extra-system-features = gccarch-znver5` here: every image
  # pins `nixpkgs.hostPlatform.gcc.arch = "znver5"`, so each derivation needs
  # the `gccarch-znver5` system feature -- but the runner host advertises it
  # daemon-side (ix hardware/znver5.nix), which is the layer Nix actually
  # consults. As a restricted setting from the untrusted CI runner user it was
  # ignored regardless, emitting only a "not a trusted user" warning.
  #
  # `max-jobs = auto` builds one derivation per core; `cores = 1` keeps each
  # build single-threaded. The closure is wide, so parallelism comes from
  # building many derivations at once, not threads inside one build.
  # https://nix.dev/manual/nix/2.28/advanced-topics/cores-vs-jobs
  # `ca-derivations`: the rust workspace units default to
  # `contentAddressed = true` (lib/rust/cargo-unit.nix), so evaluating the
  # check / package sets resolves floating content-addressed derivations.
  # Without the feature the evaluator aborts with "experimental Nix feature
  # 'ca-derivations' is disabled". Keep the client feature here because CI
  # intentionally does not consume repository flake configuration.
  NIX_CONFIG: |-
    experimental-features = nix-command flakes ca-derivations
    accept-flake-config = false
    max-jobs = auto
    cores = 1

jobs:
  ci-budget:
    permissions:
      contents: read
      pull-requests: read
    uses: indexable-inc/index/.github/workflows/ci-budget-read-only.yml@main
    with:
      pull-request-number: ${{ github.event.pull_request.number || 0 }}
      head-sha: >-
        ${{ github.event_name == 'push'
            && github.ref == 'refs/heads/main'
            && github.sha
            || github.event_name == 'merge_group'
            && github.event.merge_group.head_sha
            || '' }}
      # A tag validates a release point rather than a bounded changed range.
      force-big-change: ${{ startsWith(github.ref, 'refs/tags/') }}

  # One job on one runner, on purpose. Every check shares a single
  # znver5-tuned nixpkgs base, so fanning the checks across several runners
  # would rebuild that shared base on each cold runner (a thundering herd). We
  # keep one runner and get parallelism *inside* it from nix-fast-build plus
  # `max-jobs = auto`. The terminal gate owns the required `flake-check` status
  # and mirrors this build result plus the total deadline.
  flake-build:
    name: flake-build
    needs: ci-budget
    # Dispatched to the org-wide ix-ci-dispatcher (vin-compute-1), the same
    # self-hosted runner the ix repo uses. The `ix-ci-run-*` label is claimed
    # by that dispatcher, which mints an ephemeral runner per job on a host
    # with a warm, persistent /nix/store. See the ix repo's ci.yml for the
    # label scheme.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-flake-check', github.run_id, github.run_attempt) }}"]
    # GitHub starts this timer only after runner assignment. It bounds extended
    # runs; the trusted controller owns ordinary queue-inclusive cancellation.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The clone diff gate reads both parents of the checked-out merge.
          fetch-depth: 0

      # Underscore digit separators: every nix invocation that evaluates this
      # tree must go through the patched client (see the action's description).
      - name: Bootstrap patched Nix client
        uses: ./.github/actions/bootstrap-patched-nix

      # The global clone budget also runs inside `.#check`, but that derivation
      # intentionally has no `.git`. Run the zero-tolerance changed-line gate
      # in the checkout so a PR cannot add duplication while staying under the
      # repository-wide percentage ratchet.
      - name: Reject duplication on changed lines
        # Warm runs finish in minutes; the only way this step reaches double
        # digits is a wedged nix daemon (index#2750 ate the whole 60-minute job
        # limit across every PR). Fail fast and loudly instead.
        timeout-minutes: 15
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # index#3038: the event base can predate the synthetic merge that
            # checkout regenerates after main advances. Its first parent is the
            # base whose tree the checked-out PR contribution was merged into.
            base_sha="$(git rev-parse --verify HEAD^1)"
          else
            base_sha="${EVENT_BASE_SHA}"
          fi
          nix run .#clone -- . --diff "${base_sha}" > /dev/null

      # Run the full gate through the repo-owned `check` app (lib/per-system.nix),
      # so CI and a local `nix run .#check` execute the same two commands from one
      # definition: nix-fast-build over `.#ciChecks.x86_64-linux`, then nix-eval-jobs
      # over `.#packages.x86_64-linux` with the JSON error-line gate. The
      # command-specific rationale (tool choice, the worker/memory tuning, why the
      # eval cache is off, the error-line gate) and the pinned tool revisions live
      # next to that wrapper. The job inherits NIX_CONFIG (above), so the inner
      # builds still see `gccarch-znver5` and the eval knobs. The terminal gate
      # below reports this build's result under the required status name.
      - name: Build all flake checks
        uses: ./.github/actions/check-logged

      # The `check` app writes nix-fast-build per-attr durations to
      # check-results.json in the workspace (see lib/per-system.nix). Upload it
      # so the blast-radius workflow can fetch the most recent successful base
      # run and annotate the rebuilt-checks list with wall-clock seconds. The
      # artifact is data-only, and the upload runs even on a failing build so a
      # partial-timings snapshot still beats no timings at all.
      - name: Upload check-results.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-timings-${{ github.run_id }}
          path: check-results.json
          if-no-files-found: warn
          retention-days: 30

  flake-check:
    name: flake-check
    needs: [ci-budget, flake-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify required result and total deadline
        uses: indexable-inc/index/.github/actions/ci-budget@main
        with:
          mode: gate
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          target-job-name: flake-build
          big-change: ${{ needs.ci-budget.outputs.big_change }}
          token: ${{ github.token }}
