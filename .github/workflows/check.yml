name: Check

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3
        with:
          # Every image in this repo pins `nixpkgs.hostPlatform.gcc.arch =
          # "znver5"`, which marks each derivation as needing the
          # `gccarch-znver5` system feature. GitHub runners don't advertise
          # that feature by default, so flake-check fails with
          # `missing system features ... Required features: {gccarch-znver5}`
          # before evaluating any image.
          #
          # `accept-flake-config` lets CI consume the flake's `nixConfig`
          # (the Cachix substituter) without an interactive prompt.
          extra-conf: |
            extra-system-features = gccarch-znver5
            accept-flake-config = true

      # Configures the indexable-inc Cachix substituter for the daemon and
      # uploads every store path realised during this job. PRs from forks
      # cannot read `secrets.CACHIX_AUTH_TOKEN` so the action degrades to
      # read-only automatically. Push-event jobs from main and release tags
      # supply the token and become writers; this gates publish credentials on
      # reviewed refs per the supply-chain rule in AGENTS.md.
      - name: Set up Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: indexable-inc
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}

      # `nix flake check` runs serially: it evaluates every flake output, then
      # builds the `checks` derivations in a single batch that only releases
      # paths to Cachix when the whole batch finishes. A failure on one closure
      # discards the prior work, so the rerun re-evaluates from scratch.
      #
      # nix-fast-build pipelines eval and build (via nix-eval-jobs) and pushes
      # each completed closure to the daemon's post-build-hook as soon as it
      # finishes, so partial progress survives a later failure. The fast
      # `nix flake check --no-build` step stays in front to catch eval-only
      # breakage in `packages` / `nixosConfigurations` attrs that the
      # `checks.eval` aggregate does not reach.
      - name: Evaluate flake outputs
        run: nix flake check --no-build -L

      - name: Build checks with nix-fast-build
        # `--inputs-from .` resolves `nixpkgs#nix-fast-build` against the
        # flake's locked nixpkgs, so the CI tool version moves with
        # `nix flake update` instead of drifting on the runner's registry.
        run: |
          nix run --inputs-from . nixpkgs#nix-fast-build -- \
            --skip-cached \
            --no-nom \
            --no-link \
            --flake .#checks.x86_64-linux
