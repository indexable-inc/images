<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img"
     font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    svg { color: #e6edf3; }
    text { fill: currentColor; }
    .muted { fill: #8b949e; }
    .box { stroke: currentColor; fill: none; }
    .edge { stroke: currentColor; fill: none; marker-end: url(#arrow); }
    .arrow { fill: #e6edf3; }
    .group { stroke: #a371f7; fill: none; stroke-dasharray: 6 4; }
    .accent { fill: #a371f7; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>
  <rect x="16" y="14" width="688" height="142" rx="10" class="group"/>
  <text x="32" y="36" font-size="11" class="accent">fleet-micro east-west group</text>
  <rect x="48" y="66" width="150" height="52" rx="6" class="box"/>
  <text x="123" y="88" font-size="13" text-anchor="middle">gateway</text>
  <text x="123" y="105" font-size="11" text-anchor="middle" class="muted">nginx upstream pool</text>
  <rect x="300" y="60" width="150" height="52" rx="6" class="box"/>
  <rect x="294" y="66" width="150" height="52" rx="6" class="box"/>
  <rect x="288" y="72" width="150" height="52" rx="6" class="box"/>
  <text x="363" y="94" font-size="13" text-anchor="middle">api-0..2</text>
  <text x="363" y="111" font-size="11" text-anchor="middle" class="muted">maxUnavailable = 1</text>
  <rect x="540" y="66" width="130" height="52" rx="6" class="box"/>
  <text x="605" y="88" font-size="13" text-anchor="middle">cache</text>
  <text x="605" y="105" font-size="11" text-anchor="middle" class="muted">redis :6379</text>
  <line x1="198" y1="92" x2="280" y2="92" class="edge"/>
  <text x="239" y="84" font-size="11" text-anchor="middle" class="muted">http probes</text>
  <line x1="450" y1="92" x2="532" y2="92" class="edge"/>
  <text x="491" y="84" font-size="11" text-anchor="middle" class="muted">tcp probe</text>
  <text x="360" y="146" font-size="11" text-anchor="middle" class="muted">rolling update: one replica recreated at a time, gated by health checks</text>
</svg>
