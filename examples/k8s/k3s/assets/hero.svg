<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img"
     font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    svg { color: #1f2328; }
    text { fill: currentColor; }
    .muted { fill: #656d76; }
    .box { stroke: currentColor; fill: none; }
    .edge { stroke: currentColor; fill: none; marker-end: url(#arrow); }
    .arrow { fill: #1f2328; }
    .group { stroke: #8250df; fill: none; stroke-dasharray: 6 4; }
    .accent { fill: #8250df; }
    .pod { stroke: #8250df; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>
  <rect x="16" y="14" width="688" height="162" rx="10" class="group"/>
  <text x="32" y="36" font-size="11" class="accent">k8s-k3s east-west group</text>

  <rect x="48" y="62" width="170" height="72" rx="6" class="box"/>
  <text x="133" y="84" font-size="13" text-anchor="middle">k3s-server</text>
  <text x="133" y="101" font-size="11" text-anchor="middle" class="muted">API 6443 - sqlite</text>
  <text x="133" y="118" font-size="11" text-anchor="middle" class="muted">manifests from Nix</text>

  <rect x="300" y="62" width="170" height="72" rx="6" class="box"/>
  <text x="385" y="84" font-size="13" text-anchor="middle">k3s-agent-0</text>
  <rect x="316" y="96" width="138" height="26" rx="5" class="pod"/>
  <text x="385" y="113" font-size="11" text-anchor="middle" class="accent">whoami pod</text>

  <rect x="516" y="62" width="170" height="72" rx="6" class="box"/>
  <text x="601" y="84" font-size="13" text-anchor="middle">k3s-agent-1</text>
  <rect x="532" y="96" width="138" height="26" rx="5" class="pod"/>
  <text x="601" y="113" font-size="11" text-anchor="middle" class="accent">whoami pod</text>

  <path d="M300,98 L222,98" class="edge"/>
  <text x="261" y="90" font-size="10" text-anchor="middle" class="muted">join</text>
  <path d="M516,88 C480,50 340,50 224,84" class="edge"/>
  <text x="370" y="52" font-size="10" text-anchor="middle" class="muted">join</text>

  <text x="360" y="164" font-size="11" text-anchor="middle" class="muted">every image and manifest ships from the nix store; NodePort 30080 answers on all three nodes</text>
</svg>
