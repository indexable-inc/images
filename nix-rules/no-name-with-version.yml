id: no-name-with-version
language: nix
severity: warning
message: "`name = \"pname-version\"` is the legacy shape. Use `pname` + `version` so updaters and finalAttrs see the version."
note: |
  WHY: nixpkgs derivations split `pname` and `version` so version-update tooling
  (`nixpkgs-update`, `nix-update`, `update.sh`) and `meta` rendering can parse
  them. A single concatenated `name` defeats all of that and makes overriding
  the version one step harder.
  NIXPKGS: nixpkgs-hammering `name-and-version` enforces.
  REPO: Use `pname = "..."; version = "...";` (stdenv derives `name = pname-version`
  automatically). This rule catches the dash-version heuristic; it accepts plain
  names like `name = "patch.json"` where the value is a filename, not a package.
rule:
  pattern: name = "$VAL"
constraints:
  VAL:
    regex: '^[A-Za-z][A-Za-z0-9_]*-[0-9]+(\.[0-9]+)+'
