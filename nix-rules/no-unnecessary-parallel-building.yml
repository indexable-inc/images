id: no-unnecessary-parallel-building
language: nix
severity: warning
message: "`enableParallelBuilding = true;` is the stdenv default since 2020. Setting it explicitly is noise."
note: |
  WHY: Modern stdenv enables parallel builds by default. The explicit
  `enableParallelBuilding = true;` survived from old templates and now reads
  as the package opting into something it already had. The opposite,
  `enableParallelBuilding = false;`, IS meaningful — keep that form.
  NIXPKGS: nixpkgs-hammering `unnecessary-parallel-building`.
  REPO: Drop the `= true` form; keep `= false` (and a one-line comment naming
  the upstream bug or non-determinism it works around).
rule:
  pattern: enableParallelBuilding = true
