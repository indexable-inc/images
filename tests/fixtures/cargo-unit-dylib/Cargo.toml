# Fixture for cargoUnit's `dylib` crate-type support.
#
# The property under test is the one a dylib exists for: exactly one copy of the
# engine's process-global state, shared by a binary and by a module the binary
# `dlopen`s at run time. Link the engine statically instead -- which is what a
# single `--extern` naming the rlib produces -- and each side gets its own
# counter, both start at zero, and nothing else about the build looks wrong.
[workspace]
members = ["engine", "host", "module"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
cargo-unit-dylib-engine = { path = "engine" }
